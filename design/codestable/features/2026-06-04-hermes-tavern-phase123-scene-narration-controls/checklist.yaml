doc_type: feature-checklist
feature: "2026-06-04-hermes-tavern-phase123-scene-narration-controls"
status: in_progress
summary: >
  Scene Narration Controls v1 adds scene-scoped POV and tense metadata, then
  exposes it through narrow commands, prompt modules, and Markdown export.

steps:
  - id: S1
    name: "DB contract: scene narration-control persistence"
    status: completed
    completed_at: "2026-06-04"
    result: >
      IMPLEMENTED - db_novel.NovelDBMixin now migrates
      novel_scene_narration_controls, exposes set/get/clear and linked-session
      lookup helpers, validates missing parent scenes with ValueError("Scene not
      found"), validates tense as past/present with ValueError("Invalid tense"),
      preserves fields on None updates, clears individual fields with blank
      strings, and removes the row when both controls are blank. Focused DB tests
      cover migration/table-set shape, set/get/update/partial-update behavior,
      blank clearing, idempotent clear, missing-scene errors, invalid tense, and
      linked-session scoping.
    description: >
      Add the novel_scene_narration_controls table, index, CRUD helpers, tense
      validation, missing-scene validation, and linked-session lookup in
      db_novel.py. Extend novel DB tests only.
    exit_signal: >
      Focused novel DB tests pass and no command/runtime prompt/export behavior
      has been implemented yet.
    verification:
      - command: "PYTHONDONTWRITEBYTECODE=1 python -m py_compile src/hermes_tavern/db_novel.py tests/test_hermes_tavern_novel_db.py"
        result: "passed (controller rerun after S1 implementation)"
      - command: "PYTHONDONTWRITEBYTECODE=1 python -m pytest tests/test_hermes_tavern_novel_db.py -q -o 'addopts='"
        result: "passed; 16 passed in 0.57s"
      - command: "PYTHONDONTWRITEBYTECODE=1 python -m pytest tests/test_hermes_tavern_novel_db.py tests/test_hermes_tavern_novel_runtime.py -q -o 'addopts='"
        result: "passed; 47 passed in 1.53s"
      - command: "PYTHONDONTWRITEBYTECODE=1 python -m pytest -q -o 'addopts='"
        result: "passed; 774 passed in 30.20s"

  - id: S2
    name: "Command surface: scene narration inspect set clear"
    status: completed
    completed_at: "2026-06-04"
    result: >
      IMPLEMENTED - runtime_novel.scene_command now routes /rp scene narration
      to a narrow command handler covering bare inspect, clear, pov, and tense
      forms. commands.py help lists the four narration forms. Runtime tests cover
      help visibility, POV/tense set and inspect behavior, field preservation,
      idempotent clear, no-controls inspect, malformed arguments, missing-scene
      translation, and invalid-tense translation. Prompt-module, Markdown export,
      README docs, architecture writeback, provider/generation, archive import,
      character/relationship state, and protected core-file behavior remain
      deferred to later slices.
    description: >
      Add /rp scene narration inspect, clear, pov, and tense forms under the
      existing scene command family. Update command help and focused runtime tests.
    exit_signal: >
      Runtime tests cover normal, boundary, missing-scene, and invalid-tense
      command behavior.
    verification:
      - command: "PYTHONDONTWRITEBYTECODE=1 python -m py_compile src/hermes_tavern/runtime_novel.py src/hermes_tavern/commands.py tests/test_hermes_tavern_novel_runtime.py"
        result: "passed (controller rerun after S2 implementation)"
      - command: "PYTHONDONTWRITEBYTECODE=1 python -m pytest tests/test_hermes_tavern_novel_runtime.py tests/test_hermes_tavern_commands.py -q -o 'addopts='"
        result: "passed; 73 passed in 1.63s"
      - command: "PYTHONDONTWRITEBYTECODE=1 python -m pytest tests/test_hermes_tavern_novel_db.py tests/test_hermes_tavern_novel_runtime.py -q -o 'addopts='"
        result: "passed; 63 passed in 2.06s"
      - command: "PYTHONDONTWRITEBYTECODE=1 python -m pytest -q -o 'addopts='"
        result: "passed; 790 passed in 31.26s"

  - id: S3
    name: "Prompt module: linked scene narration controls"
    status: completed
    completed_at: "2026-06-04"
    result: >
      IMPLEMENTED - runtime_prompt_modules.session_scene_narration_modules now
      injects one system/before_user PromptModule named scene_narration:<scene
      title> for active sessions linked to a scene with non-empty narration
      controls. It uses get_scene_narration_controls_for_session plus get_scene
      for the title, strips blank POV/tense values, emits only non-empty content
      lines, orders at insertion_order 65 before scene goal and author note, and
      skips only this module on sqlite lookup errors. Focused debug-prompt tests
      cover linked inclusion, unlinked exclusion, legacy blank-row exclusion,
      ordering, and sqlite-error skip behavior.
    description: >
      Inject a system scene_narration module only for the active session linked
      to a scene with non-empty controls. Skip cleanly on sqlite errors.
    exit_signal: >
      Debug-prompt tests prove linked inclusion, unlinked exclusion, ordering
      before scene goal/note, and sqlite-error skip behavior.
    verification:
      - command: "PYTHONDONTWRITEBYTECODE=1 python -m py_compile src/hermes_tavern/runtime_prompt_modules.py tests/test_hermes_tavern_novel_runtime.py"
        result: "passed (controller rerun after S3 implementation)"
      - command: "PYTHONDONTWRITEBYTECODE=1 python -m pytest tests/test_hermes_tavern_novel_runtime.py -k narration -q -o 'addopts='"
        result: "passed; 21 passed, 31 deselected in 0.75s"
      - command: "PYTHONDONTWRITEBYTECODE=1 python -m pytest tests/test_hermes_tavern_novel_runtime.py tests/test_hermes_tavern_runtime.py -q -o 'addopts='"
        result: "passed; 96 passed in 5.12s"
      - command: "PYTHONDONTWRITEBYTECODE=1 python -m pytest -q -o 'addopts='"
        result: "passed; 795 passed in 31.06s"

  - id: S4
    name: "Export and docs: narration visibility"
    status: completed
    completed_at: "2026-06-04"
    result: >
      IMPLEMENTED - export_project_markdown now emits non-empty scene narration
      controls under each scene heading, after any scene goal and before messages,
      no-message, or no-session fallback text. The Markdown block uses the same
      field labels as the prompt/debug surfaces ("Scene narration controls:",
      "POV:", and "Tense:"), omits empty fields, and suppresses the whole block
      when controls are absent or blank. README Core commands now list all four
      /rp scene narration forms, and focused docs tests pin those literals.
    description: >
      Include non-empty narration controls in project Markdown export and update
      README command visibility. Do not add archive ZIP/import formats.
    exit_signal: >
      DB/runtime/docs tests prove Markdown placement and README command coverage.
    verification:
      - command: "PYTHONDONTWRITEBYTECODE=1 python -m py_compile src/hermes_tavern/db_novel.py tests/test_hermes_tavern_novel_db.py tests/test_hermes_tavern_readme_docs.py"
        result: "passed (controller rerun after S4 implementation)"
