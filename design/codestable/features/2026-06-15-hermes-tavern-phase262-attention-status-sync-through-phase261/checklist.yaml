steps:
  - id: S1
    name: "S1: Sync CodeStable attention status and regression"
    status: completed
    owner_mode: executor
    controller_only: false
    description: "Update the mandatory CodeStable attention current-status bullet through accepted Phase 261 and update the existing static docs regression to guard that status line."
    allowed_files:
      - design/codestable/attention.md
      - tests/test_hermes_tavern_codestable_status.py
    acceptance_criteria:
      - "design/codestable/attention.md has exactly one current-status bullet."
      - "The current-status bullet starts with Current status (2026-06-15): All phases 1-261 accepted."
      - "The current-status bullet contains Phase 168 through Phase 261 short labels."
      - "The current-status bullet preserves the valid internal Phase 121-167 range."
      - "The current-status bullet rejects stale standalone 1-260 and 1–260 terminal markers."
      - "The current-status bullet ends with the final suffix through Phase 261."
      - "tests/test_hermes_tavern_codestable_status.py has CURRENT_STATUS_PREFIX advanced to 2026-06-15 and 1-261."
      - "tests/test_hermes_tavern_codestable_status.py has STALE_STATUS_PREFIX and stale standalone markers advanced to 2026-06-15 and 1-260."
      - "tests/test_hermes_tavern_codestable_status.py includes Phase 168 through Phase 261 labels explicitly."
      - "tests/test_hermes_tavern_codestable_status.py asserts range(168, 262)."
      - "tests/test_hermes_tavern_codestable_status.py rejects stale range(168, 261) without embedding that stale range as a direct literal."
      - "tests/test_hermes_tavern_codestable_status.py has exactly one CURRENT_STATUS_PREFIX assignment."
      - "tests/test_hermes_tavern_codestable_status.py remains static and explicit, with no glob/rglob/iterdir/os.walk generated discovery."
      - "S1 changed paths are limited to design/codestable/attention.md and tests/test_hermes_tavern_codestable_status.py."
      - "S1 does not create phase262-acceptance.md and does not mark final accepted statuses."
    verification_commands:
      - "PYTHONDONTWRITEBYTECODE=1 python -m py_compile tests/test_hermes_tavern_codestable_status.py"
      - "PYTHONDONTWRITEBYTECODE=1 PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest tests/test_hermes_tavern_codestable_status.py -q -o 'addopts=' -p no:cacheprovider -s"
      - "Static marker guard defined in checks.static_marker_guard."
      - "S1 changed-path guard defined in checks.changed_path_guard_s1."
      - "Protected-path guard defined in checks.protected_path_guard."
      - "Allowed/prohibited overlap guard defined in checks.overlap_guard."
      - "git diff --check"

  - id: S2
    name: "S2: Controller/parent-only Phase 262 acceptance closeout"
    status: completed
    owner_mode: controller
    controller_only: true
    depends_on:
      - S1
    description: "Record acceptance evidence and finalize only the new Phase 262 CodeStable artifacts after S1 verification passes and parent/controller reruns validators, tests, and guards."
    allowed_files:
