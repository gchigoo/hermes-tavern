    acceptance_criteria:
      - "phase262-acceptance.md is created only by the controller/parent."
      - "checklist.yaml is updated only for closeout status/evidence."
      - "design.md is updated only for closeout metadata if needed."
      - "S2 changed paths are limited to the three new Phase 262 feature artifacts."
      - "Changed paths are limited to the five allowed files across S1 and S2."
      - "No Phase 261 artifact is edited during this phase."
      - "No older accepted feature artifact is edited."

checks:
  - id: C1
    name: "Phase 262 design frontmatter validator"
    command: "PYTHONDONTWRITEBYTECODE=1 python design/codestable/tools/validate-yaml.py --file design/codestable/features/2026-06-15-hermes-tavern-phase262-attention-status-sync-through-phase261/design.md --require doc_type --require status --require feature --require implementation_ready"
    status: passed
  - id: C2
    name: "Phase 262 checklist YAML validator"
    command: "PYTHONDONTWRITEBYTECODE=1 python design/codestable/tools/validate-yaml.py --file design/codestable/features/2026-06-15-hermes-tavern-phase262-attention-status-sync-through-phase261/checklist.yaml --yaml-only --require doc_type --require status --require feature --require implementation_ready"
    status: passed
  - id: C3
    name: "Focused status regression py_compile"
    command: "PYTHONDONTWRITEBYTECODE=1 python -m py_compile tests/test_hermes_tavern_codestable_status.py"
    status: passed
  - id: C4
    name: "Focused status regression pytest"
    command: "PYTHONDONTWRITEBYTECODE=1 PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest tests/test_hermes_tavern_codestable_status.py -q -o 'addopts=' -p no:cacheprovider -s"
    status: passed
  - id: C5
    name: "Static marker/stale guard"
    command: "PYTHONDONTWRITEBYTECODE=1 python -c \"from pathlib import Path; import re; line=[l for l in Path('design/codestable/attention.md').read_text(encoding='utf-8').splitlines() if re.match(r'^\\s*-\\s*Current status ', l)]; assert len(line)==1; status=line[0]; test=Path('tests/test_hermes_tavern_codestable_status.py').read_text(encoding='utf-8'); assert status.startswith('- Current status (2026-06-15): All phases 1-261 accepted'); assert 'Current status (2026-06-15): All phases 1-260 accepted' not in status; assert re.search(r'(?<!\\d)1-260(?!\\d)', status) is None; assert re.search(r'(?<!\\d)1–260(?!\\d)', status) is None; assert re.search(r'(?<!\\d)Phase 121-167(?!\\d)', status) is not None; assert status.endswith('Phase 259 attention status sync through Phase 258, Phase 260 attention status sync through Phase 259, and Phase 261 attention status sync through Phase 260.'); assert all(f'Phase {phase} ' in status for phase in range(168, 262)); assert 'Phase 261 attention status sync through Phase 260' in status and 'Phase 261 attention status sync through Phase 260' in test; assert re.findall(r'^CURRENT_STATUS_PREFIX\\s*=', test, re.M) == ['CURRENT_STATUS_PREFIX =']; assert 'range(168, 262)' in test; stale=''.join(['range(168, ', '26', '1', ')']); assert stale not in test; assert '.glob(' not in test and '.rglob(' not in test and 'iterdir(' not in test and 'os.walk' not in test\""
    status: passed
  - id: C6
    name: "S1 changed-path guard"
    command: "git diff --name-only -- design/codestable/attention.md tests/test_hermes_tavern_codestable_status.py"
    status: passed
  - id: C7
    name: "Protected-path guard"
    command: "git diff --name-only -- run_agent.py cli.py gateway src plugins README.md design/HERMES_TAVERN_DESIGN.md design/codestable/architecture design/codestable/roadmap design/codestable/requirements design/codestable/compound build/lib"
    status: passed
  - id: C8
    name: "Whitespace diff guard"
    command: "git diff --check"
    status: passed
  - id: C9
    name: "Full registry pytest"
    command: "python -m pytest -q"
    status: passed
