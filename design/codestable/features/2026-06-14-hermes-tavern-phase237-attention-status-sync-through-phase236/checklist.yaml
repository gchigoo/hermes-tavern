      - Allowed/prohibited overlap guard.
      - Changed-path allowlist guard confirms S1 changed only design/codestable/attention.md and tests/test_hermes_tavern_codestable_status.py before S2 closeout.
      - Protected-path guard confirms no runtime/source/plugin/provider/prompt/generation/import/export/schema/root-design/architecture/reference/README/roadmap/requirements/compound/build/Hermes core paths, Phase 236 artifacts, or older accepted feature artifacts changed during S1.
      - git diff --check
