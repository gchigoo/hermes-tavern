      - The current-status bullet rejects stale standalone 1-235 and 1–235 terminal markers.
      - The current-status bullet ends with the final suffix through Phase 236.
      - tests/test_hermes_tavern_codestable_status.py has CURRENT_STATUS_PREFIX advanced to 1-236.
      - tests/test_hermes_tavern_codestable_status.py has STALE_STATUS_PREFIX and stale standalone markers advanced to 1-235.
      - tests/test_hermes_tavern_codestable_status.py includes Phase 168 through Phase 236 labels explicitly.
      - tests/test_hermes_tavern_codestable_status.py asserts range(168, 237).
      - tests/test_hermes_tavern_codestable_status.py has exactly one CURRENT_STATUS_PREFIX assignment.
      - tests/test_hermes_tavern_codestable_status.py remains static and explicit, with no glob/rglob/iterdir/os.walk generated phase discovery.
      - S1 changed paths are limited to design/codestable/attention.md and tests/test_hermes_tavern_codestable_status.py.
      - S1 does not create phase237-acceptance.md and does not mark final accepted statuses.
    verification_commands:
      - PYTHONDONTWRITEBYTECODE=1 python -m py_compile tests/test_hermes_tavern_codestable_status.py
      - PYTHONDONTWRITEBYTECODE=1 PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest tests/test_hermes_tavern_codestable_status.py -q -o 'addopts=' -p no:cacheprovider -s
