doc_type: feature-checklist
feature: hermes-tavern-phase70-active-session-media-delivery
date: "2026-05-29"
status: implemented

summary: >
  Add a low-risk gateway contract for active-session, non-/rp responses that
  contain MEDIA markers. The chat adapter receives cleaned text while the
  original response remains routed to the gateway media delivery helper.

steps:
  - id: S1
    name: "Add active-session media gateway hook contract"
    description: >
      Extend the gateway hook tests with an active-session non-/rp dispatch.
      The test monkeypatches TavernRuntime active-message handling to return a
      MEDIA response, avoiding provider/runtime generation changes, and asserts
      the adapter gets cleaned text while media delivery receives the original
      response.
    status: verified
    changed_file: "tests/test_hermes_tavern_gateway_hook.py"
    result: "PASS - focused active-session media gateway hook contract passed"

  - id: S2
    name: "Focused gateway tests"
    description: >
      Run gateway dispatch and gateway hook modules to verify existing
      Telegram/mobile behavior plus the new active-session MEDIA delivery
      contract.
