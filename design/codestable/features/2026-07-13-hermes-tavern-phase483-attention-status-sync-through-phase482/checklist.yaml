    command: 'PYTHONDONTWRITEBYTECODE=1 /usr/local/bin/python3 design/codestable/tools/validate-yaml.py --dir design/codestable/features/2026-07-13-hermes-tavern-phase483-attention-status-sync-through-phase482 --require doc_type --require status --require feature'
  - id: V2
    owner: parent_controller
    status: passed_parent_controller
    command: |
      PYTHONDONTWRITEBYTECODE=1 /usr/local/bin/python3 -c \
      "import py_compile; py_compile.compile('tests/test_hermes_tavern_codestable_status.py', cfile='/tmp/hermes-tavern-phase483-status-test.pyc', doraise=True)"
  - id: V3
    owner: parent_controller
    status: passed_parent_controller
    command: 'TMPDIR=/tmp env -u PYTEST_DISABLE_PLUGIN_AUTOLOAD -u HERMES_SESSION_KEY -u HERMES_SESSION_ID HERMES_HOME=/Users/steven/.hermes PYTHONDONTWRITEBYTECODE=1 /usr/local/bin/python3 -m pytest tests/test_hermes_tavern_codestable_status.py -q -o addopts= -p no:cacheprovider'
  - id: V4
    owner: parent_controller
    status: passed_parent_controller
    command: 'TMPDIR=/tmp env -u PYTEST_DISABLE_PLUGIN_AUTOLOAD -u HERMES_SESSION_KEY -u HERMES_SESSION_ID HERMES_HOME=/Users/steven/.hermes PYTHONDONTWRITEBYTECODE=1 /usr/local/bin/python3 -m pytest -q -o addopts= -p no:cacheprovider'
  - id: V5
    owner: parent_controller
    status: passed_parent_controller
    command: |
      set -e
      PYTHONDONTWRITEBYTECODE=1 /usr/local/bin/python3 - <<'PY'
      import re
      import runpy
      from pathlib import Path

      attention_path = Path("design/codestable/attention.md")
      test_path = Path("tests/test_hermes_tavern_codestable_status.py")

      lines = attention_path.read_text(encoding="utf-8").splitlines()
      test_text = test_path.read_text(encoding="utf-8")
      ns = runpy.run_path(str(test_path))

      status_lines = [x for x in lines if re.match(r"^\s*-\s*Current status ", x)]
      assert len(status_lines) == 1
      status = status_lines[0]

      adult = "- Adult-fiction non-negotiable boundaries defined in design doc §12.3 — do not build features that bypass provider safety systems."
      assert lines.index(status) == lines.index(adult) + 1
      assert lines.index(status) < lines.index("### Hermes Tavern 凭证约束")

      assert status.startswith(
          "- Current status (2026-06-18): All phases 1-483 accepted"
      )
      assert status.endswith(
          "Phase 481 attention status sync through Phase 480, "
          "Phase 482 attention status sync through Phase 481, and "
          "Phase 483 attention status sync through Phase 482."
      )

      labels = ns["REQUIRED_PHASE_LABELS"]
      assert len(labels) == 316
      assert all(status.count(label) == 1 for label in labels)
      assert [status.index(label) for label in labels] == sorted(
          status.index(label) for label in labels
      )

      assert 'phase_range = range(168, 484)' in test_text
      assert 'aggregate_range = "range(168, 484)"' in test_text
      assert "stale_aggregate_range_483" in test_text
      assert "stale_aggregate_guard_483" in test_text
      assert 'later_phase_label = f"Phase {phase_range.stop} "' in test_text

      later = f"Phase {max(int(x.split()[1]) for x in labels) + 1} "
      assert later not in status
      assert later not in test_text
      PY
      PYTHONDONTWRITEBYTECODE=1 /usr/local/bin/python3 - <<'PY'
      import re
      import subprocess
      from pathlib import Path

      base = "eefd9128f899abea6db6f0bf3ab3491b420adaf6"
      phase = Path("design/codestable/features/2026-07-13-hermes-tavern-phase483-attention-status-sync-through-phase482")
      allowed = {
          str(phase / "design.md"),
          str(phase / "checklist.yaml"),
          str(phase / "acceptance.md"),
      }

      def out(*args):
          return subprocess.check_output(args, text=True).splitlines()

      assert subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip() == base

      changed = set(out("git", "diff", "--name-only"))
      changed |= set(out("git", "diff", "--cached", "--name-only"))
      changed |= set(out("git", "ls-files", "--others", "--exclude-standard"))

      assert changed <= allowed, changed - allowed
      assert str(phase / "checklist.yaml") in changed
      assert str(phase / "acceptance.md") in changed
      assert (phase / "acceptance.md").is_file()

      acceptance = (phase / "acceptance.md").read_text(encoding="utf-8")
      frontmatter = acceptance.split("\n---", 1)[0]
      assert re.search(
          r"(?m)^status:\s*[\"']?drafted_pending_parent_verification[\"']?\s*$",
          frontmatter,
      )
      assert "accepted_at:" not in frontmatter
      assert re.search(r"(?m)^parent_verification_required:\s*true\s*$", frontmatter)
      assert re.search(r"(?m)^parent_verification_completed:\s*false\s*$", frontmatter)
      assert re.search(r"(?m)^parent_commit_or_push_performed:\s*false\s*$", frontmatter)

      checklist = (phase / "checklist.yaml").read_text(encoding="utf-8")
      for expected in (
          "status: implemented_pending_parent_verification",
          "workflow_status: implemented_pending_parent_verification",
          "acceptance_state: drafted_pending_parent_verification",
          "parent_verification_required: true",
          "parent_verification_completed: false",
          "parent_commit_or_push_performed: false",
          "acceptance_md_present: true",
      ):
          assert expected in checklist, expected

      assert "status: pending_controller" in checklist
      assert "acceptance_creation: drafted_pending_parent_verification" in checklist
      PY
      PYTHONDONTWRITEBYTECODE=1 /usr/local/bin/python3 - <<'PY'
      import subprocess
      from pathlib import Path

      paths = set(subprocess.check_output(
          ["git", "diff", "--name-only"], text=True
      ).splitlines())
      paths |= set(subprocess.check_output(
          ["git", "ls-files", "--others", "--exclude-standard"], text=True
      ).splitlines())

      bad_ws = []
      bad_eof = []
      for name in paths:
          p = Path(name)
          if not p.is_file():
              continue
          text = p.read_text(encoding="utf-8")
          if not text.endswith("\n"):
              bad_eof.append(name)
          for number, line in enumerate(text.splitlines(), 1):
              if line.rstrip() != line:
                  bad_ws.append((name, number))

      assert not bad_eof, bad_eof
      assert not bad_ws, bad_ws
      PY
