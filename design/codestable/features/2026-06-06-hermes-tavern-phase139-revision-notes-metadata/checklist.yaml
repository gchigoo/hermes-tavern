    risk: "Users may assume revision notes trigger generated rewrites or versioning."
    mitigation: "Keep command/docs wording metadata-only/inert and defer rewrite/version workflows."
  - id: R3
    risk: "Export ordering can become unstable as project metadata sections grow."
    mitigation: "Add focused inclusion, omission, and ordering tests for ## Revision Notes."

