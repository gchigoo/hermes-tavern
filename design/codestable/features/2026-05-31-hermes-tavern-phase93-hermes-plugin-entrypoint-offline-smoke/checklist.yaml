implementation_notes: |
  - This phase is packaging/release preflight only.
  - The entry point metadata smoke creates a temporary venv under pytest tmp_path
    and installs the locally built wheel with pip --no-index --no-deps.
  - The subprocess smoke runs from tmp_path/outside with PYTHONPATH cleared and
    PYTHONNOUSERSITE=1, then asserts repo-root paths are absent from cwd,
    sys.path, and the loaded hermes_tavern module file.
  - The smoke discovers `hermes-tavern` via installed distribution metadata in
    the `hermes_agent.plugins` entry point group and loads/calls the register
    contract without importing from the repository checkout.
  - Existing dirty worktree changes outside the packaging test and this
    checklist are not modified by this phase.

