doc_type: feature-checklist
feature: hermes-tavern-phase93-hermes-plugin-entrypoint-offline-smoke
date: "2026-05-31"
status: implemented

summary: >
  Add a narrow packaging/release preflight smoke that builds the Hermes Tavern
  wheel, installs it into an isolated temporary virtualenv, and verifies a
  Hermes-style plugin loader can discover and load the hermes-tavern entry point
  from installed distribution metadata without relying on repository path
  injection. This phase must not start, reload, restart, kill, or manage Gateway,
  and must not call provider/model, network, ComfyUI, TTS, or credential
  endpoints.

steps:
  - id: S1
    name: "Add entry point metadata loader smoke"
    description: >
      Extend the packaging test module with an offline wheel build, temporary
      virtualenv creation, no-index/no-deps wheel install, and an outside-repo
      script that uses importlib.metadata.entry_points for the
      hermes_agent.plugins group to find hermes-tavern, load the entry point,
      call register(ctx), and verify the pre_gateway_dispatch callback comes
      from hermes_tavern.gateway_hook.
    status: implemented
    changed_file: "tests/test_hermes_tavern_packaging.py"
    result: "IMPLEMENTED - added installed distribution entry point metadata loader smoke and reused the isolated wheel install helper"

  - id: S2
    name: "Record Phase93 checklist"
    description: >
      Add this CodeStable checklist for the Hermes plugin entry point offline
      smoke slice, keeping packaging/release validation steps explicit and
      scoped.
    status: implemented
    changed_file: "design/codestable/features/2026-05-31-hermes-tavern-phase93-hermes-plugin-entrypoint-offline-smoke/checklist.yaml"
    result: "IMPLEMENTED - checklist created with focused packaging, compile, pytest, YAML, and diff gates"

  - id: S3
    name: "Focused packaging pytest"
    description: >
      Run only the Hermes Tavern packaging regression module after adding the
      installed entry point metadata loader smoke.
    verification_command: >
      python -m pytest tests/test_hermes_tavern_packaging.py -q -o 'addopts='
    status: verified
    result: "PASS - controller rerun returned 18 passed in 6.71s"

  - id: S4
