implementation_notes: |
  - This phase is test-only; no source/runtime/provider code changed.
  - The regression uses local in-memory events and a temporary sqlite store only.
    It does not introduce secrets, real provider calls, model calls, network
    calls, or production imports from plugins.hermes_tavern under
    src/hermes_tavern/.
