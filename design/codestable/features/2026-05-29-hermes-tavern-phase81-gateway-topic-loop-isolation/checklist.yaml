doc_type: feature-checklist
feature: hermes-tavern-phase81-gateway-topic-loop-isolation
date: "2026-05-29"
status: implemented

summary: >
  Add an end-to-end gateway hook regression for a same-user mobile RP loop split
  across two thread/topic IDs. The hook should route /rp start, ordinary active
  messages, pause, post-pause fallthrough, continued active messages from the
  other topic, and /rp sessions all without cross-topic message storage,
  active-state mutation, or session listing leakage.

steps:
  - id: S1
    name: "Add gateway topic loop regression"
    description: >
      Extend tests/test_hermes_tavern_gateway_hook.py with a same-user,
      same-platform, same-chat gateway loop covering /rp start in two thread IDs,
      ordinary active messages scoped to each topic session, /rp pause for one
      topic only, ordinary post-pause fallthrough for the paused topic, continued
      interception for the still-active topic, and /rp sessions all scoped to the
      requesting topic.
    status: verified
    changed_file: "tests/test_hermes_tavern_gateway_hook.py"
    result: "PASS - Codex Phase81 regression added"

  - id: S2
    name: "Focused gateway hook pytest"
    description: >
      Run the gateway hook test file after the Phase81 topic loop isolation
      regression.
    verification_command: >
      python -m pytest tests/test_hermes_tavern_gateway_hook.py -q -o 'addopts='
    status: verified
    result: "PASS - controller rerun 2026-05-29; 16 passed in 0.43s"

  - id: S3
    name: "Full py_compile gate"
    description: >
      Compile the standalone plugin source, importers, compatibility shim, and
      Tavern test modules.
    verification_command: >
      python -m py_compile conftest.py plugins/__init__.py plugins/hermes_tavern/__init__.py src/hermes_tavern/*.py src/hermes_tavern/importers/*.py tests/test_hermes_tavern_*.py
    status: verified
    result: "PASS - controller rerun 2026-05-29; no compile errors"

  - id: S4
    name: "Full Tavern pytest gate"
    description: >
      Run the complete Hermes Tavern test glob after the gateway topic loop
      isolation regression.
    verification_command: >
      python -m pytest tests/test_hermes_tavern_*.py -q -o 'addopts='
    status: verified
    result: "PASS - controller rerun 2026-05-29; 613 passed in 12.05s"

  - id: S5
    name: "Checklist YAML validation"
    description: >
      Validate this CodeStable checklist with the project YAML validator.
    verification_command: >
      python design/codestable/tools/validate-yaml.py --file design/codestable/features/2026-05-29-hermes-tavern-phase81-gateway-topic-loop-isolation/checklist.yaml
    status: verified
