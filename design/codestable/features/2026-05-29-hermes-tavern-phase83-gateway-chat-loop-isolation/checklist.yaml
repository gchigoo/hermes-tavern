doc_type: feature-checklist
feature: hermes-tavern-phase83-gateway-chat-loop-isolation
date: "2026-05-29"
status: implemented

summary: >
  Add an end-to-end gateway hook regression for a same-user, same-platform,
  same-thread mobile RP loop split across two chat_id values. The hook should
  route /rp start, ordinary active messages, pause, post-pause fallthrough,
  continued active messages from the other chat, and /rp sessions all without
  cross-chat message storage, active-state mutation, session listing leakage, or
  adapter chat routing leakage.

steps:
  - id: S1
    name: "Add gateway chat loop regression"
    description: >
      Extend tests/test_hermes_tavern_gateway_hook.py with a same-user,
      same-platform, same-thread gateway loop covering /rp start in chat-1 and
      chat-2, ordinary active messages scoped to each chat session, /rp pause for
      chat-1 only, ordinary post-pause fallthrough for chat-1, continued
      interception for chat-2, /rp sessions all scoped to chat-1, and sends
      routed to the matching chat id.
    status: verified
    changed_file: "tests/test_hermes_tavern_gateway_hook.py"
    result: "PASS - Codex Phase83 regression added"

  - id: S2
    name: "Focused gateway hook pytest"
    description: >
      Run the gateway hook test file after the Phase83 chat loop isolation
      regression.
    verification_command: >
      python -m pytest tests/test_hermes_tavern_gateway_hook.py -q -o 'addopts='
    status: verified
    result: "PASS - controller rerun 2026-05-29; 18 passed in 0.45s"

  - id: S3
    name: "Full py_compile gate"
    description: >
      Compile the standalone plugin source, importers, compatibility shim, and
      Tavern test modules.
    verification_command: >
      python -m py_compile conftest.py plugins/__init__.py plugins/hermes_tavern/__init__.py src/hermes_tavern/*.py src/hermes_tavern/importers/*.py tests/test_hermes_tavern_*.py
    status: verified
    result: "PASS - controller rerun 2026-05-29; no compile errors"

  - id: S4
    name: "Full Tavern pytest gate"
    description: >
      Run the complete Hermes Tavern test glob after the gateway chat loop
      isolation regression.
    verification_command: >
      python -m pytest tests/test_hermes_tavern_*.py -q -o 'addopts='
    status: verified
    result: "PASS - controller rerun 2026-05-29; 615 passed in 11.77s"

  - id: S5
    name: "Checklist YAML validation"
    description: >
      Validate this CodeStable checklist with the project YAML validator.
    verification_command: >
      python design/codestable/tools/validate-yaml.py --file design/codestable/features/2026-05-29-hermes-tavern-phase83-gateway-chat-loop-isolation/checklist.yaml
    status: verified
    result: "PASS - controller rerun 2026-05-29; 1 file passed, 0 failed"

implementation_notes: |
  - This phase is test-only; no source/runtime/provider code changed.
  - The regression uses local in-memory events, a mock platform adapter, and a
    temporary sqlite store only. It does not introduce secrets, real provider
    calls, model calls, network calls, or production imports from
    plugins.hermes_tavern under src/hermes_tavern/.
