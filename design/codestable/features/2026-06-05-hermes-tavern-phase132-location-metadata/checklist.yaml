checks:
  - id: C1
    name: "C1: Active checklist precondition"
    status: pending
    criteria: >
      Before implementation, no unrelated feature checklist is planned, pending,
      or in progress; this Phase 132 checklist is the only active feature.

  - id: C2
    name: "C2: Persistence contract"
    status: pending
    criteria: >
      `novel_locations` migration, project foreign key/index, CRUD/list helpers,
      missing project/ID behavior, blank-label rejection, and blank-description
      rejection are covered by focused DB tests.

  - id: C3
    name: "C3: Command contract"
    status: pending
    criteria: >
      `/rp location add/list/inspect/update/delete` command literals return
      compact normal and error messages, require explicit project ID for add,
      support active-project fallback for list only, and are visible through
      help and README guards.

  - id: C4
    name: "C4: Markdown export"
    status: pending
    criteria: >
      Project Markdown export includes `## Locations` only when location rows
      exist, orders it after Style Guide and before Characters/Relationships/
      Chapters, and omits it for projects without location rows.

  - id: C5
    name: "C5: Offline no-leak boundary"
    status: pending
    criteria: >
      Location text does not appear in `/rp debug prompt` or `/rp debug context`;
      prompt module selection, context-budget composition, provider calls, model
      routing, content mode, credentials, generation, vectorization/retrieval,
      and summarization behavior remain unchanged.

  - id: C6
    name: "C6: Reverse-scope verification"
    status: pending
    criteria: >
      No protected core files, build artifacts, prompt/provider/model/generation
      files, credential paths, cloud/collab paths, minors/underage paths, ST
      asset importer/exporter paths, default-binding behavior, canon/content-mode
      policy behavior, or provider-safety-bypass behavior are changed.
