doc_type: feature-checklist
feature: "2026-06-05-hermes-tavern-phase132-location-metadata"
date: "2026-06-05"
status: planned
summary: >
  Location Metadata v1 adds local project-scoped location notes backed by
  `novel_locations`, managed through `/rp location ...` commands, optionally
  visible in Markdown export, and verified to remain outside prompt/debug/
  context-budget/provider/generation/content-mode/vectorization/retrieval paths.

steps:
  - id: S1
    name: "S1: Location Metadata implementation"
    status: pending
    description: >
      Add local project-scoped location persistence, the `/rp location ...`
      command family, help/README command literals, optional Markdown export
      visibility, and focused DB/runtime/docs tests. Keep implementation inside
      the allowed plugin/source/docs/test files and avoid prompt/provider/model/
      content-mode/generation paths.
    allowed_files:
      - src/hermes_tavern/db_novel.py
      - src/hermes_tavern/runtime_novel.py
      - src/hermes_tavern/runtime.py
      - src/hermes_tavern/commands.py
      - README.md
      - tests/test_hermes_tavern_novel_db.py
      - tests/test_hermes_tavern_novel_runtime.py
      - tests/test_hermes_tavern_commands.py
      - tests/test_hermes_tavern_readme_docs.py
    prohibited_files:
      - run_agent.py
      - cli.py
      - gateway/run.py
      - src/hermes_tavern/runtime_prompt_modules.py
      - src/hermes_tavern/prompt.py
      - src/hermes_tavern/runtime_debug.py
      - src/hermes_tavern/model_router.py
      - src/hermes_tavern/provider_bridge.py
      - src/hermes_tavern/adapters.py
      - src/hermes_tavern/runtime_model.py
      - src/hermes_tavern/runtime_generation.py
      - src/hermes_tavern/runtime_content.py
      - src/hermes_tavern/importers/**
      - build/lib/**
    explicit_non_goals:
      - No automatic location extraction, summarization, vectorization, retrieval, map/geocoding, provider calls, generation changes, or scheduled update cycle.
      - No prompt module injection, debug/context-budget inclusion, model routing, content-mode behavior, credential persistence, ST asset importer/exporter, cloud/collaboration, backend account, minors/underage, or provider-safety-bypass behavior.
      - No broad runtime/db refactor beyond the minimum local command and metadata surface.
    exit_signal: >
      Location persistence, commands, help/docs, export visibility, and no-leak
      tests pass in focused verification; no protected core, prompt, provider,
      router, credential, content-mode, generation, retrieval/vectorization,
      cloud/collab, minors/underage, ST asset importer/exporter, build-artifact,
      or safety-bypass file changes are present.
    verification:
      - command: >-
          PYTHONDONTWRITEBYTECODE=1 python -m py_compile src/hermes_tavern/db_novel.py src/hermes_tavern/runtime_novel.py src/hermes_tavern/runtime.py src/hermes_tavern/commands.py tests/test_hermes_tavern_novel_db.py tests/test_hermes_tavern_novel_runtime.py tests/test_hermes_tavern_commands.py tests/test_hermes_tavern_readme_docs.py
        expected: "passes"
      - command: >-
          PYTHONDONTWRITEBYTECODE=1 python -m pytest tests/test_hermes_tavern_novel_db.py tests/test_hermes_tavern_novel_runtime.py tests/test_hermes_tavern_commands.py tests/test_hermes_tavern_readme_docs.py -q -o 'addopts=' -p no:cacheprovider
        expected: "passes"
      - command: >-
          PYTHONDONTWRITEBYTECODE=1 python -m pytest tests/test_hermes_tavern_*.py -q -o 'addopts=' -p no:cacheprovider
        expected: "passes"
      - command: >-
          PYTHONDONTWRITEBYTECODE=1 python -m pytest -q -o 'addopts=' -p no:cacheprovider
        expected: "passes"
      - command: >-
          git diff --name-only -- run_agent.py cli.py gateway/run.py src/hermes_tavern/runtime_prompt_modules.py src/hermes_tavern/prompt.py src/hermes_tavern/runtime_debug.py src/hermes_tavern/model_router.py src/hermes_tavern/provider_bridge.py src/hermes_tavern/adapters.py src/hermes_tavern/runtime_model.py src/hermes_tavern/runtime_generation.py src/hermes_tavern/runtime_content.py build/lib
