      - command: "git diff --check"
        expected: "passes"

  - id: S2
    name: "S2: Verify/Accept/Write Architecture"
    status: pending
    description: >
      Run focused, plugin, full, YAML/frontmatter, reverse-scope, and whitespace
      verification. Create the acceptance report and update architecture/root
      design to mark location metadata current while preserving deferred
      automation/retrieval/provider/generation/default-binding/policy boundaries.
    allowed_files:
      - design/codestable/features/2026-06-05-hermes-tavern-phase132-location-metadata/design.md
      - design/codestable/features/2026-06-05-hermes-tavern-phase132-location-metadata/checklist.yaml
      - design/codestable/features/2026-06-05-hermes-tavern-phase132-location-metadata/hermes-tavern-phase132-location-metadata-acceptance.md
