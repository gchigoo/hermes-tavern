  - id: static-marker-guard
    status: passed
    owner_mode: controller
    command: |
      PYTHONDONTWRITEBYTECODE=1 python - <<'PY'
      import re
      from pathlib import Path

      attention = Path("design/codestable/attention.md").read_text(encoding="utf-8")
      test_path = Path("tests/test_hermes_tavern_codestable_status.py")
      test = test_path.read_text(encoding="utf-8")

      expected = "Current status (2026-06-15): All phases 1-251 accepted"
      stale = "Current status (2026-06-15): All phases 1-250 accepted"
      append_label = "Phase 251 attention status sync through Phase 250"
      suffix = "Phase 249 attention status sync through Phase 248, Phase 250 attention status sync through Phase 249, and Phase 251 attention status sync through Phase 250."
      stale_range = "range(" + "168" + ", 25" + "1)"

      status_lines = [line for line in attention.splitlines() if re.match(r"^\s*-\s*Current status ", line)]
      assert len(status_lines) == 1, status_lines
      status = status_lines[0]

      assert status.startswith(f"- {expected}")
      assert stale not in status
      assert re.search(r"(?<!\d)1\-250(?!\d)", status) is None
      assert re.search(r"(?<!\d)1–250(?!\d)", status) is None
      assert re.search(r"(?<!\d)Phase 121-167(?!\d)", status) is not None
      assert append_label in status
      assert status.endswith(suffix)
      assert all(f"Phase {phase} " in status for phase in range(168, 252))

      assert re.findall(r"^CURRENT_STATUS_PREFIX\s*=", test, re.M) == ["CURRENT_STATUS_PREFIX ="]
      assert expected in test
      assert stale in test
      assert append_label in test
      assert suffix in test
      assert "range(168, 252)" in test
      assert stale_range not in test
      assert "glob(" not in test
      assert "rglob(" not in test
      assert "iterdir(" not in test
      assert "os.walk" not in test
      PY

