risks:
  - Style-sample terminology can be confused with the Phase 124 project style guide; keep `/rp style sample ...` metadata separate from `/rp project style ...` prompt behavior.
  - Style samples can invite generation, retrieval, or style imitation behavior; keep this to plain user-authored metadata and no provider calls.
  - Repeated metadata families increase `db_novel.py` and `runtime_novel.py` size; do not mix a refactor into this phase.
  - Export ordering can create stale docs; require S2 stale-wording scans and architecture/root-design writeback.
  - Adult-fiction compatibility must remain provider-safe; do not add minors/underage examples, policy bypasses, or content-mode behavior.

reverse_scope_guards:
  - No edits to `run_agent.py`, `cli.py`, or `gateway/run.py`.
  - No prompt injection, project-style-guide prompt changes, debug/context-budget inclusion, generation, provider/model routing, credential, content-mode, retrieval/vectorization, automation, memory/summarization, media/TTS/image, cloud/collab, archive, default-binding, relationship graph/rename/extraction, automatic extraction, or ST importer/exporter behavior.
  - No minors/underage fields, examples, tests, commands, or safety-classification surfaces.
  - No CodeStable acceptance/architecture/root-design writeback during S1; this feature's design/checklist status updates are controller-owned.
  - No build artifact changes under `build/lib/**`.