doc_type: feature-checklist
feature: hermes-tavern-phase51-plugin-yaml-version-sync
date: "2026-05-29"
status: implemented

summary: >
  Enforce that plugin.yaml version stays in sync with the installed package version
  (pyproject.toml) by adding a dedicated test. Also explicitly declare
  dependencies = [] in pyproject.toml to make the "no runtime deps" contract
  visible to tooling. Prevents silent version drift when pyproject.toml is bumped
  without a matching plugin.yaml update.

steps:
  - id: S1
    name: "Add dependencies = [] to pyproject.toml"
    description: >
      Add an explicit dependencies = [] field under [project] in pyproject.toml.
      The field was previously absent; PEP 621 defaults to empty but being explicit
      documents the intentional no-runtime-deps contract and satisfies strict
      validators that expect the key to be present.
    status: verified
    changed_file: "pyproject.toml"
    result: "PASS — 2026-05-29; dependencies = [] added to [project] table"

  - id: S2
    name: "Add test_plugin_yaml_version_matches_package_version"
    description: >
      Add test_plugin_yaml_version_matches_package_version to
      tests/test_hermes_tavern_packaging.py. The test reads plugin.yaml via
      importlib.resources, parses with yaml.safe_load, and asserts that
      data["version"] equals hermes_tavern.__version__ (which is sourced from
      importlib.metadata, i.e. pyproject.toml at install time). This catches
      drift between the two version fields before it reaches production.
    status: verified
    changed_file: "tests/test_hermes_tavern_packaging.py"
    result: "PASS — 2026-05-29; test_plugin_yaml_version_matches_package_version passes; plugin.yaml 0.1.0 == __version__ 0.1.0"

  - id: S3
    name: "py_compile smoke check"
    description: >
      Compile all shim, source, importer, and test files to confirm no syntax errors.
    status: verified
    verification_command: >
      python -m py_compile conftest.py plugins/__init__.py plugins/hermes_tavern/__init__.py src/hermes_tavern/*.py src/hermes_tavern/importers/*.py tests/test_hermes_tavern_*.py
    result: "PASS — 2026-05-29; no syntax errors"

  - id: S4
    name: "Full standalone test suite"
    description: >
      Run the full standalone Tavern pytest glob to verify no regressions.
      Expect 449 passed (was 448; +1 new version-sync test).
    status: verified
    verification_command: >
      python -m pytest tests/test_hermes_tavern_*.py -q -o 'addopts='
    result: "PASS — 2026-05-29; 449 passed in 10.45s (was 448; +1 new version-sync test)"

  - id: S5
    name: "Checklist YAML validation"
    description: >
      Validate this CodeStable checklist with the project YAML validator.
    status: verified
    verification_command: >
      python design/codestable/tools/validate-yaml.py --file design/codestable/features/2026-05-29-hermes-tavern-phase51-plugin-yaml-version-sync/checklist.yaml
    result: "PASS — 2026-05-29; 1 file passed, 0 failed"

implementation_notes: |
  - plugin.yaml version (YAML field) is a hardcoded string independent of the
    Python packaging system. When pyproject.toml version is bumped with a release,
    plugin.yaml must be updated manually; this test makes the omission visible
    in CI instead of silently shipping mismatched metadata.
  - hermes_tavern.__version__ reads from importlib.metadata at import time, which
    tracks pyproject.toml (after an editable or wheel install). The Phase 50
    isolation smoke proves this path works end-to-end without conftest.py help.
  - dependencies = [] is purely a metadata annotation; no code paths were changed.
    The hermes_constants host-provided module is intentionally not listed because
    it comes from the hermes-agent runtime environment, not from PyPI.
