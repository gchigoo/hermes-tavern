doc_type: feature-checklist
feature: hermes-tavern-phase78-session-key-normalization
date: "2026-05-29"
status: implemented

summary: >
  Add focused regression coverage for the gateway event to Tavern session scope
  key normalization contract. Session keys must consistently normalize missing
  thread and identity fields, preserve topic fallback behavior, use enum-like
  values, tolerate attribute access failures, and distinguish session scope
  when any identity component changes.

steps:
  - id: S1
    name: "Add session key normalization regressions"
    description: >
      Extend tests/test_hermes_tavern_identity.py with focused coverage for
      missing, None, and empty thread_id normalization; topic_id fallback;
      explicit thread_id precedence; platform, chat_id, thread/topic, and
      user_id key contribution; unknown fallback values; direct event and
      event.source identity layouts; attribute access failures; and enum-like
      value handling.
    status: verified
    changed_file: "tests/test_hermes_tavern_identity.py"
    result: "PASS - Codex focused Phase78 identity regressions passed"

  - id: S2
    name: "Focused identity pytest"
    description: >
      Run the focused identity helper tests covering the Phase78 session key
      normalization contract.
    verification_command: >
      python -m pytest tests/test_hermes_tavern_identity.py -q -o 'addopts='
    status: verified
    result: "PASS - controller rerun 2026-05-29; 10 passed in 0.01s"

  - id: S3
    name: "Full py_compile gate"
    description: >
      Compile the standalone plugin source, importers, compatibility shim, and
      Tavern test modules.
    verification_command: >
      python -m py_compile conftest.py plugins/__init__.py plugins/hermes_tavern/__init__.py src/hermes_tavern/*.py src/hermes_tavern/importers/*.py tests/test_hermes_tavern_*.py
    status: verified
    result: "PASS - controller rerun 2026-05-29; no compile errors"

  - id: S4
    name: "Full Tavern pytest gate"
    description: >
      Run the complete Hermes Tavern test glob after the session key
      normalization regressions.
    verification_command: >
      python -m pytest tests/test_hermes_tavern_*.py -q -o 'addopts='
    status: verified
    result: "PASS - controller rerun 2026-05-29; 604 passed in 12.37s"

  - id: S5
    name: "Checklist YAML validation"
    description: >
      Validate this CodeStable checklist with the project YAML validator.
    verification_command: >
      python design/codestable/tools/validate-yaml.py --file design/codestable/features/2026-05-29-hermes-tavern-phase78-session-key-normalization/checklist.yaml
    status: verified
    result: "PASS - controller rerun 2026-05-29; 1 file passed, 0 failed"

implementation_notes: |
  - This phase is test-only; no source/runtime/provider code changed.
  - The regressions use local in-memory event objects and do not introduce
    secrets, real provider calls, model calls, network calls, or production
    imports from plugins.hermes_tavern under src/hermes_tavern/.
