    status: planned
    criteria: >
      Project Markdown export includes `## Plot Threads` only when plot-thread
      rows exist, orders it after Organizations and before Characters/
      Relationships/Chapters, and omits it for projects without plot-thread rows.

  - id: C5
    name: "C5: Offline no-leak boundary"
    status: planned
    criteria: >
      Plot-thread text does not appear in `/rp debug prompt` or `/rp debug
      context`; prompt module selection, context-budget composition, provider
      calls, model routing, content mode, credentials, generation, media/TTS/
      image behavior, vectorization/retrieval, automation, and summarization
      behavior remain unchanged.

