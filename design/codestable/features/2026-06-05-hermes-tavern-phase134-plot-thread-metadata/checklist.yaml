      architecture writeback, root-design writeback, or provider-safety-bypass
      file changes are present in S1.

risks:
  - Plot-thread terminology can be confused with gateway thread identity; use `/rp plot thread ...` and do not touch identity/session scope code.
  - Plot threads can invite automation or generated planning; keep this to plain user-authored metadata and no provider calls.
  - Repeated metadata families increase `db_novel.py` and `runtime_novel.py` size; do not mix a refactor into this phase.
  - Export ordering can create stale docs; require S2 stale-wording scans and architecture/root-design writeback.
  - Adult-fiction compatibility must remain provider-safe; do not add minors/underage examples, policy bypasses, or content-mode behavior.

reverse_scope_guards:
  - No edits to `run_agent.py`, `cli.py`, or `gateway/run.py`.
  - No prompt injection, debug/context-budget inclusion, generation, provider/model routing, credential, content-mode, retrieval/vectorization, automation, memory/summarization, media/TTS/image, cloud/collab, archive, default-binding, relationship graph/rename/extraction, or ST importer/exporter behavior.
  - No minors/underage fields, examples, tests, commands, or safety-classification surfaces.
  - No CodeStable status/acceptance/architecture/root-design writeback during S1.
  - No build artifact changes under `build/lib/**`.
