    status: planned
    criteria: >
      No protected core files, build artifacts, prompt/provider/model/generation
      files, credential paths, content-mode paths, retrieval/vectorization paths,
      memory/summarization paths, media/TTS/image paths, cloud/collab paths,
      minors/underage paths, ST importer/exporter paths, default-binding paths,
