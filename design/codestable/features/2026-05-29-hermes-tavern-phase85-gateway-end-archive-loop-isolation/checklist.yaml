doc_type: feature-checklist
feature: hermes-tavern-phase85-gateway-end-archive-loop-isolation
date: "2026-05-29"
status: implemented

summary: >
  Add a gateway hook regression for two same-chat mobile RP scopes where /rp end
  and /rp archive are issued by only one caller. Each command should deactivate
  only the caller scope, allow later ordinary messages from that inactive scope
  to fall through without storage, continue intercepting and storing ordinary
  messages for the other active scope, and keep /rp sessions all scoped to the
  requesting caller.

steps:
  - id: S1
    name: "Add gateway end/archive loop regression"
    description: >
      Extend tests/test_hermes_tavern_gateway_hook.py with a two-user,
      same-chat gateway loop covering /rp start for both users, /rp end and /rp
      archive for user A only, ordinary post-command fallthrough for user A,
      ordinary continued interception for user B, and /rp sessions all scoped to
      user A without exposing user B's id prefix, full id, or scope key.
    status: verified
    changed_file: "tests/test_hermes_tavern_gateway_hook.py"
    result: "PASS - Codex Phase85 regression added"

  - id: S2
    name: "Focused gateway hook pytest"
    description: >
      Run the gateway hook test file after the Phase85 end/archive loop
      isolation regression.
    verification_command: >
      python -m pytest tests/test_hermes_tavern_gateway_hook.py -q -o 'addopts='
    status: verified
    result: "PASS - controller rerun 2026-05-29; 22 passed in 1.07s"

  - id: S3
    name: "Full py_compile gate"
    description: >
      Compile the standalone plugin source, importers, compatibility shim, and
      Tavern test modules.
    verification_command: >
      python -m py_compile conftest.py plugins/__init__.py plugins/hermes_tavern/__init__.py src/hermes_tavern/*.py src/hermes_tavern/importers/*.py tests/test_hermes_tavern_*.py
    status: verified
    result: "PASS - controller rerun 2026-05-29; no compile errors"

  - id: S4
    name: "Full Tavern pytest gate"
    description: >
      Run the complete Hermes Tavern test glob after the gateway end/archive
      loop isolation regression.
    verification_command: >
      python -m pytest tests/test_hermes_tavern_*.py -q -o 'addopts='
    status: verified
    result: "PASS - controller rerun 2026-05-29; 619 passed in 12.85s"

  - id: S5
    name: "Checklist YAML validation"
    description: >
      Validate this CodeStable checklist with the project YAML validator.
    verification_command: >
      python design/codestable/tools/validate-yaml.py --file design/codestable/features/2026-05-29-hermes-tavern-phase85-gateway-end-archive-loop-isolation/checklist.yaml
    status: verified
    result: "PASS - controller rerun 2026-05-29; 1 file passed, 0 failed"

implementation_notes: |
  - This phase is test-only; no source/runtime/provider code changed.
  - The regression uses local in-memory events, a mock platform adapter, and a
    temporary sqlite store only. It does not introduce secrets, real provider
    calls, model calls, network calls, or production imports from
    plugins.hermes_tavern under src/hermes_tavern/.
