doc_type: feature-checklist
feature: hermes-tavern-phase80-gateway-multi-user-loop
date: "2026-05-29"
status: implemented

summary: >
  Add an end-to-end gateway hook regression for a two-user mobile RP loop. The
  hook should route /rp start, ordinary active messages, pause, post-pause
  fallthrough, continued active messages from another user, and /rp sessions all
  without cross-scope message storage, active-state mutation, or session listing
  leakage.

steps:
  - id: S1
    name: "Add gateway multi-user loop regression"
    description: >
      Extend tests/test_hermes_tavern_gateway_hook.py with a two-user gateway
      loop covering /rp start for both users, ordinary active messages scoped to
      each user's session, /rp pause for one user only, ordinary post-pause
      fallthrough for the paused user, continued interception for the still
      active user, and /rp sessions all scoped to the requesting user.
    status: verified
    changed_file: "tests/test_hermes_tavern_gateway_hook.py"
    result: "PASS - controller-authored Phase80 regression added"

  - id: S2
    name: "Focused gateway hook pytest"
    description: >
      Run the gateway hook test file after the Phase80 multi-user regression.
    verification_command: >
      python -m pytest tests/test_hermes_tavern_gateway_hook.py -q -o 'addopts='
    status: verified
    result: "PASS - controller rerun 2026-05-29; 15 passed in 0.34s"

  - id: S3
    name: "Full py_compile gate"
    description: >
      Compile the standalone plugin source, importers, compatibility shim, and
      Tavern test modules.
    verification_command: >
      python -m py_compile conftest.py plugins/__init__.py plugins/hermes_tavern/__init__.py src/hermes_tavern/*.py src/hermes_tavern/importers/*.py tests/test_hermes_tavern_*.py
    status: verified
    result: "PASS - controller rerun 2026-05-29; no compile errors"

  - id: S4
    name: "Full Tavern pytest gate"
    description: >
      Run the complete Hermes Tavern test glob after the gateway multi-user loop
      regression.
    verification_command: >
      python -m pytest tests/test_hermes_tavern_*.py -q -o 'addopts='
    status: verified
    result: "PASS - controller rerun 2026-05-29; 612 passed in 11.88s"

  - id: S5
    name: "Checklist YAML validation"
    description: >
      Validate this CodeStable checklist with the project YAML validator.
    verification_command: >
      python design/codestable/tools/validate-yaml.py --file design/codestable/features/2026-05-29-hermes-tavern-phase80-gateway-multi-user-loop/checklist.yaml
    status: verified
    result: "PASS - controller rerun 2026-05-29; 1 file passed, 0 failed"

implementation_notes: |
  - Claude Code was requested for this phase, but print-mode Opus/Opus 4.8
    attempts returned API Error 401 despite `claude auth status --text` showing
    a Claude Pro account. Per Hermes Tavern fallback rules, this phase was kept
    deterministic and controller-owned.
  - This phase is test-only; no source/runtime/provider code changed.
  - The regression uses local in-memory events and a temporary sqlite store only.
    It does not introduce secrets, real provider calls, model calls, network
    calls, or production imports from plugins.hermes_tavern under
    src/hermes_tavern/.
