doc_type: feature-checklist
feature: hermes-tavern-phase60-entrypoint-loader-contract
date: "2026-05-29"
status: implemented

summary: >
  Add a test-only hardening phase that validates the package plugin.yaml
  entry_point using the same dynamic import contract expected from a plugin
  loader: split module:function, import the module, getattr the function, invoke
  it, and confirm pre_gateway_dispatch is registered.

steps:
  - id: S1
    name: "Add dynamic entrypoint loader contract test"
    description: >
      Extend tests/test_hermes_tavern_packaging.py with a regression test that
      reads hermes_tavern/plugin.yaml as package data, resolves entry_point via
      importlib.import_module and getattr, invokes the resolved callable, and
      asserts that pre_gateway_dispatch is registered.
    status: verified
    changed_file: "tests/test_hermes_tavern_packaging.py"
    result: "PASS - focused entrypoint loader contract test passed"

  - id: S2
    name: "Focused packaging test run"
    description: >
      Run packaging tests to verify the new dynamic entrypoint contract test
      alongside the existing package metadata and entrypoint checks.
    status: verified
    verification_command: >
      python -m pytest tests/test_hermes_tavern_packaging.py -q -o 'addopts='
    result: "PASS — controller rerun 2026-05-29; 13 passed in 0.12s"

  - id: S3
    name: "py_compile smoke check"
    description: >
      Compile the standalone shim, source, importer, and Tavern test files.
    status: verified
    verification_command: >
      python -m py_compile conftest.py plugins/__init__.py plugins/hermes_tavern/__init__.py src/hermes_tavern/*.py src/hermes_tavern/importers/*.py tests/test_hermes_tavern_*.py
    result: "PASS — controller rerun 2026-05-29; no syntax errors"

  - id: S4
    name: "Full Tavern test suite"
    description: >
      Run the full standalone Tavern pytest glob to confirm the test-only
      hardening phase does not regress existing behavior.
    status: verified
    verification_command: >
      python -m pytest tests/test_hermes_tavern_*.py -q -o 'addopts='
    result: >
      PASS — controller rerun 2026-05-29; 558 passed in 9.62s. Codex's own
      subprocess previously reported 8 transient image-test failures, but the
      controller-owned rerun is green.

  - id: S5
    name: "Checklist YAML validation"
    description: >
      Validate this checklist with the project YAML validator.
    status: verified
    verification_command: >
      python design/codestable/tools/validate-yaml.py --file design/codestable/features/2026-05-29-hermes-tavern-phase60-entrypoint-loader-contract/checklist.yaml
    result: "PASS — controller rerun 2026-05-29; 1 file passed, 0 failed"

implementation_notes: |
  - This phase is test-only; no runtime behavior changed.
  - The new test avoids provider calls, network access, and secrets.
  - The assertion covers the plugin loader contract more directly than a plain
    entry_point string equality check.
