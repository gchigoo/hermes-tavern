  - id: static-marker-guard
    status: passed
    owner_mode: controller
    command: |
      PYTHONDONTWRITEBYTECODE=1 python - <<'PY'
      import re
      from pathlib import Path

      attention = Path("design/codestable/attention.md").read_text(encoding="utf-8")
      test_path = Path("tests/test_hermes_tavern_codestable_status.py")
      test = test_path.read_text(encoding="utf-8")

      expected = "Current status (2026-06-15): All phases 1-258 accepted"
      stale = "Current status (2026-06-15): All phases 1-257 accepted"
      append_label = "Phase 258 attention status sync through Phase 257"
      suffix = "Phase 256 attention status sync through Phase 255, Phase 257 attention status sync through Phase 256, and Phase 258 attention status sync through Phase 257."
      stale_range = "".join(["range(168, ", "25", "8", ")"])

      status_lines = [line for line in attention.splitlines() if re.match(r"^\s*-\s*Current status ", line)]
      assert len(status_lines) == 1, status_lines
      status = status_lines[0]

      assert status.startswith(f"- {expected}")
      assert stale not in status
      assert append_label in status
      assert status.endswith(suffix)
      assert re.search(r"(?<!\d)1-257(?!\d)", status) is None
      assert re.search(r"(?<!\d)1–257(?!\d)", status) is None
      assert re.search(r"(?<!\d)Phase 121-167(?!\d)", status) is not None
      assert all(f"Phase {phase} " in status for phase in range(168, 259))

      assert 'CURRENT_STATUS_PREFIX = "Current status (2026-06-15): All phases 1-258 accepted"' in test
      assert re.findall(r"^CURRENT_STATUS_PREFIX\s*=", test, re.M) == ["CURRENT_STATUS_PREFIX ="]
      assert 'STALE_STATUS_PREFIX = "Current status (2026-06-15): All phases 1-257 accepted"' in test
      assert 'STALE_PHASE_MARKER = "1-257"' in test
      assert 'STALE_PHASE_MARKER_EN_DASH = "1–257"' in test
      assert append_label in test
      assert suffix in test
      assert "range(168, 259)" in test
      assert stale_range not in test
      assert all(f'"Phase {phase} ' in test for phase in range(168, 259))
      assert ".glob(" not in test
      assert ".rglob(" not in test
      assert "iterdir(" not in test
      assert "os.walk" not in test
      PY

