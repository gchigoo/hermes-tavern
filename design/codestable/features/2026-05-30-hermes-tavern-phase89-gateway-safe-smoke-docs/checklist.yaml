doc_type: feature-checklist
feature: hermes-tavern-phase89-gateway-safe-smoke-docs
date: "2026-05-30"
status: implemented

summary: >
  Productize the Phase88 /rp doctor handoff documentation while keeping Gateway
  smoke docs safe for agent-driven verification. README should include the
  offline doctor command and plugin install/enablement guidance, but must not
  expose a copy-paste Gateway restart command in repo smoke instructions.

steps:
  - id: S1
    name: "Update safe Telegram/Gateway smoke docs"
    description: >
      Add /rp doctor to the README quick smoke sequence and core commands, and
      replace the executable Gateway restart line with prose that leaves Gateway
      start/reload timing to the human operator.
    status: verified
    changed_file: "README.md"
    result: "PASS - README documents /rp doctor and no longer contains the exact unsafe restart command"

  - id: S2
    name: "Add README documentation safety regression"
    description: >
      Add a focused docs regression that confirms README mentions /rp doctor,
      does not contain the exact unsafe Gateway restart command, and still
      includes install or plugin enablement guidance.
    status: verified
    changed_file: "tests/test_hermes_tavern_readme_docs.py"
    result: "PASS - focused README docs regression added"

  - id: S3
    name: "Focused README docs pytest"
    description: >
      Run only the README documentation regression test for this docs-only
      phase. This gate does not start, reload, or otherwise manage Gateway.
    verification_command: >
      python -m pytest tests/test_hermes_tavern_readme_docs.py -q -o 'addopts='
    status: verified
    result: "PASS - controller rerun 2026-05-30; 3 passed in 0.01s"

  - id: S4
    name: "Checklist YAML validation"
    description: >
      Validate this CodeStable checklist with the project YAML validator.
    verification_command: >
      python design/codestable/tools/validate-yaml.py --file design/codestable/features/2026-05-30-hermes-tavern-phase89-gateway-safe-smoke-docs/checklist.yaml
    status: verified
    result: "PASS - controller rerun 2026-05-30; 1 file passed, 0 failed"

  - id: S5
    name: "Full py_compile gate"
    description: >
      Compile the standalone plugin source, importers, compatibility shim, and
      Tavern test modules.
    verification_command: >
      python -m py_compile conftest.py plugins/__init__.py plugins/hermes_tavern/__init__.py src/hermes_tavern/*.py src/hermes_tavern/importers/*.py tests/test_hermes_tavern_*.py
    status: verified
    result: "PASS - controller rerun 2026-05-30; no compile errors"

  - id: S6
    name: "Full Tavern pytest gate"
    description: >
      Run the complete Hermes Tavern test glob after the README docs safety
      change.
    verification_command: >
      python -m pytest tests/test_hermes_tavern_*.py -q -o 'addopts='
    status: verified
    result: "PASS - controller rerun 2026-05-30; 627 passed in 13.76s"

implementation_notes: |
  - This phase is documentation and regression-test only.
  - No Gateway restart, reload, launchctl, pkill, kill, provider/model,
    network, ComfyUI, credential, profile, or Gateway state operation is part of
    this checklist.
