      Check only the files touched by this phase for whitespace errors.
    verification_command: >
      git diff --check -- tests/test_hermes_tavern_packaging.py design/codestable/features/2026-05-31-hermes-tavern-phase92-wheel-install-isolated-smoke/checklist.yaml
    status: passed
    result: "PASSED - controller run exited 0 with no output"

implementation_notes: |
  - This phase is packaging/release preflight only.
  - The wheel install smoke creates a temporary venv under pytest tmp_path and
    installs the locally built wheel with pip --no-index --no-deps.
  - The subprocess smoke runs from tmp_path/outside with PYTHONPATH cleared and
    asserts repo-root paths are absent from sys.path, so conftest.py and the
    legacy repo-root plugins shim are not required.
  - Existing dirty worktree changes outside the packaging test and this
    checklist are not modified by this phase.

