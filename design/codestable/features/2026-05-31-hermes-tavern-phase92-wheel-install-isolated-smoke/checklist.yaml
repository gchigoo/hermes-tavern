doc_type: feature-checklist
feature: hermes-tavern-phase92-wheel-install-isolated-smoke
date: "2026-05-31"
status: implemented

summary: >
  Add a narrow packaging/release preflight smoke that builds a Hermes Tavern
  wheel, installs it into an isolated temporary virtualenv without dependency
  resolution, and verifies the installed package can register its Gateway hook
  from outside the repository without conftest.py path injection or the legacy
  repo-root plugins shim. This phase must not start, reload, restart, kill, or
  manage Gateway, and must not call provider/model, network, ComfyUI, TTS, or
  credential endpoints.

steps:
  - id: S1
    name: "Add isolated wheel install smoke"
    description: >
      Extend the packaging test module with an offline wheel build, temporary
      virtualenv creation, no-index/no-deps wheel install, and an outside-repo
      script that imports hermes_tavern, reads plugin.yaml via
      importlib.resources, calls register(ctx), and verifies a
      pre_gateway_dispatch hook was registered.
    status: implemented
    changed_file: "tests/test_hermes_tavern_packaging.py"
    result: "IMPLEMENTED - added isolated virtualenv wheel install smoke and shared the Phase91 build helper"

  - id: S2
    name: "Record Phase92 checklist"
    description: >
      Add this CodeStable checklist for the isolated wheel install smoke slice,
      keeping packaging/release validation steps explicit and scoped.
    status: implemented
    changed_file: "design/codestable/features/2026-05-31-hermes-tavern-phase92-wheel-install-isolated-smoke/checklist.yaml"
    result: "IMPLEMENTED - checklist created with focused packaging, compile, pytest, YAML, and diff gates"

  - id: S3
    name: "Focused packaging pytest"
    description: >
      Run only the Hermes Tavern packaging regression module after adding the
      isolated wheel install smoke.
    verification_command: >
      python -m pytest tests/test_hermes_tavern_packaging.py -q -o 'addopts='
    status: passed
    result: "PASSED - controller run returned 17 passed in 4.14s"

  - id: S4
    name: "Full py_compile gate"
