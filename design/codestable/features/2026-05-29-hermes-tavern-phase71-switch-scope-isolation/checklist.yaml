doc_type: feature-checklist
feature: hermes-tavern-phase71-switch-scope-isolation
date: "2026-05-29"
status: implemented

summary: >
  Add focused regression coverage for /rp switch session isolation. A caller
  must not be able to switch to or activate sessions owned by another
  user/platform scope using either short prefixes or full session ids.

steps:
  - id: S1
    name: "Add cross-scope switch regressions"
    description: >
      Extend the session browser tests to cover cross-user full-id switching and
      cross-platform prefix/full-id switching through /rp switch.
    status: verified
    changed_file: "tests/test_hermes_tavern_session_browser.py"
    result: "PASS - focused /rp switch scope isolation tests passed"

  - id: S2
    name: "Focused session/security/runtime tests"
    description: >
      Run session browser and gateway security focused tests to verify the
      command security boundary without provider calls or network access.
    verification_command: >
      python -m pytest tests/test_hermes_tavern_session_browser.py tests/test_hermes_tavern_gateway_security.py tests/test_hermes_tavern_runtime.py -q -o 'addopts='
    status: verified
    result: "PASS — controller rerun 2026-05-29; 107 passed in 4.00s"

  - id: S3
    name: "py_compile smoke check"
    description: >
      Compile the standalone shim, source modules, importer modules, and Tavern
      tests after the regression-only change.
    verification_command: >
      python -m py_compile conftest.py plugins/__init__.py plugins/hermes_tavern/__init__.py src/hermes_tavern/*.py src/hermes_tavern/importers/*.py tests/test_hermes_tavern_*.py
    status: verified
    result: "PASS — controller rerun 2026-05-29; no syntax errors"

  - id: S4
    name: "Full Tavern test suite"
    description: >
      Run the full standalone Tavern pytest glob and record any transient image
      failures honestly without changing unrelated runtime/provider code.
    verification_command: >
      python -m pytest tests/test_hermes_tavern_*.py -q -o 'addopts='
    status: verified
    result: >
      PASS — controller rerun 2026-05-29; 570 passed in 9.55s. Codex's own
      subprocess previously reported 8 transient image-test failures, but the
      controller-owned rerun is green.

  - id: S5
    name: "Checklist YAML validation"
    description: >
      Validate this checklist with the project YAML validator.
    verification_command: >
      python design/codestable/tools/validate-yaml.py --file design/codestable/features/2026-05-29-hermes-tavern-phase71-switch-scope-isolation/checklist.yaml
    status: verified
    result: "PASS — controller rerun 2026-05-29; 1 file passed, 0 failed"

implementation_notes: |
  - This phase is test-only; no production runtime behavior changed.
  - Existing scoped lookup and activation checks already prevent cross-scope
    /rp switch activation.
  - No secrets, real provider calls, network calls, schema changes, or
    unrelated session UX changes are introduced.
