doc_type: feature-checklist
feature: hermes-tavern-phase96-readme-card-import-format-accuracy
date: "2026-06-01"
status: implemented

summary: >
  Correct README card-import format documentation so /rp card import advertises
  only JSON and PNG character-card support, while explicitly noting that WebP
  and JPEG are not supported yet and return friendly unsupported-format errors.
  This phase is docs, tests, and checklist only; it must not start, reload,
  kill, or manage Gateway, and must not call provider/model/network/ComfyUI/TTS
  or credential endpoints.

steps:
  - id: S1
    name: "Correct README card import format wording"
    description: >
      Update the quick smoke and core command documentation so /rp card import
      mentions JSON/PNG character cards only and documents WebP/JPEG as not
      supported yet with friendly unsupported-format errors.
    status: implemented
    changed_file: "README.md"
    result: "IMPLEMENTED - quick smoke and core command lines now document JSON/PNG support and WebP/JPEG unsupported behavior"

  - id: S2
    name: "Add README format regression"
    description: >
      Extend the pure file-reading README docs test to prevent card import docs
      from drifting back to JSON/PNG/WebP or JSON/PNG/JPEG support claims, while
      requiring JSON/PNG support plus WebP/JPEG unsupported-format behavior.
    status: implemented
    changed_file: "tests/test_hermes_tavern_readme_docs.py"
    result: "IMPLEMENTED - added pure README assertions for JSON/PNG support, WebP/JPEG unsupported-format behavior, and no JSON/PNG/WebP support claim"

  - id: S3
    name: "Focused README docs pytest"
    description: >
      Run only the README docs regression module.
    verification_command: >
      python -m pytest tests/test_hermes_tavern_readme_docs.py -q -o 'addopts='
    status: verified
    result: "PASS - 4 passed in 0.01s"

  - id: S4
    name: "Full py_compile gate"
    description: >
      Compile the compatibility shim, standalone plugin source, importers, and
      Tavern test modules.
    verification_command: >
      python -m py_compile conftest.py plugins/__init__.py plugins/hermes_tavern/__init__.py src/hermes_tavern/*.py src/hermes_tavern/importers/*.py tests/test_hermes_tavern_*.py
    status: verified
    result: "PASS - exited 0 with no compile output"

  - id: S5
    name: "Full Tavern pytest gate"
    description: >
      Run the complete Hermes Tavern test glob after the README docs change,
      without managing Gateway or calling real providers.
    verification_command: >
      python -m pytest tests/test_hermes_tavern_*.py -q -o 'addopts='
    status: verified
    result: >
      PASS - controller rerun returned 643 passed in 19.65s. Codex's earlier
      full-glob attempt saw a transient image-provider mock failure, but the
      controller rerun after inspection passed cleanly.

  - id: S6
    name: "Checklist YAML validation"
    description: >
      Validate this CodeStable checklist with the project YAML validator.
    verification_command: >
      python design/codestable/tools/validate-yaml.py --file design/codestable/features/2026-06-01-hermes-tavern-phase96-readme-card-import-format-accuracy/checklist.yaml
    status: verified
    result: "PASS - validated 1 file: 1 passed, 0 failed"

  - id: S7
    name: "Scoped diff whitespace check"
    description: >
      Check only files touched by this phase for whitespace errors.
    verification_command: >
      git diff --check -- README.md tests/test_hermes_tavern_readme_docs.py design/codestable/features/2026-06-01-hermes-tavern-phase96-readme-card-import-format-accuracy/checklist.yaml
    status: verified
    result: "PASS - exited 0 with no whitespace errors"

