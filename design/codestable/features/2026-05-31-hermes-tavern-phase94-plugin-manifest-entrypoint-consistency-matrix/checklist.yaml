implementation_notes: |
  - This phase is packaging/release preflight only.
  - The matrix test is offline and in-process: it reads local metadata files,
    imports the current hermes_tavern package, and checks README strings.
  - The pyproject entry point group is required to contain the exact
    hermes-tavern = "hermes_tavern" mapping without overconstraining unrelated
    future entry points in that group.
  - The matrix keeps the hyphenated distribution/plugin name (`hermes-tavern`)
    and underscored import package (`hermes_tavern`) boundary explicit.
  - Existing dirty worktree changes outside the packaging test and this
    checklist are not modified by this phase.

