doc_type: feature-checklist
feature: hermes-tavern-phase94-plugin-manifest-entrypoint-consistency-matrix
date: "2026-05-31"
status: implemented

summary: >
  Add a small packaging/release preflight consistency matrix that keeps the
  Hermes Tavern pyproject metadata, plugin manifest, canonical import package,
  entry point declarations, and README packaging references aligned. This phase
  must not start, reload, restart, kill, or manage Gateway, and must not call
  provider/model, network, ComfyUI, TTS, or credential endpoints.

steps:
  - id: S1
    name: "Add consistency matrix test"
    description: >
      Extend the packaging test module with an offline in-process matrix that
      parses pyproject.toml and src/hermes_tavern/plugin.yaml, imports the
      current hermes_tavern package version, and asserts the distribution name,
      plugin name, version, entry point string, entry point group metadata,
      hyphen-to-underscore naming boundary, and README packaging references all
      agree.
    status: implemented
    changed_file: "tests/test_hermes_tavern_packaging.py"
    result: "IMPLEMENTED - added focused manifest/entrypoint consistency matrix and small metadata parsing helpers"

  - id: S2
    name: "Record Phase94 checklist"
    description: >
      Add this CodeStable checklist for the plugin manifest and entry point
      consistency matrix slice, keeping the packaging/release validation gates
      explicit and scoped.
    status: implemented
    changed_file: "design/codestable/features/2026-05-31-hermes-tavern-phase94-plugin-manifest-entrypoint-consistency-matrix/checklist.yaml"
    result: "IMPLEMENTED - checklist created with focused packaging, compile, pytest, YAML, and diff gates"

  - id: S3
    name: "Focused packaging pytest"
    description: >
      Run only the Hermes Tavern packaging regression module after adding the
      consistency matrix test.
    verification_command: >
