doc_type: feature-checklist
feature: hermes-tavern-phase90-repo-hygiene-release-preflight
date: "2026-05-31"
status: implemented

summary: >
  Add a small release-preflight repo hygiene regression for Hermes Tavern local
  generated artifacts, keeping the slice limited to .gitignore, a pure
  file-reading test, and this CodeStable checklist. This phase must not start,
  reload, restart, or manage Gateway, and must not call provider/model,
  network, ComfyUI, TTS, or credential endpoints.

steps:
  - id: S1
    name: "Update .gitignore for generated artifacts"
    description: >
      Ensure local Python caches, pytest cache, virtualenv/env files, package
      build outputs, continuous phase logs, and plain log files are ignored.
    status: implemented
    changed_file: ".gitignore"
    result: "IMPLEMENTED - added missing .pytest_cache/, build/, logs/continuous-phases/, and *.log entries while keeping existing entries"

  - id: S2
    name: "Add focused repo hygiene regression"
    description: >
      Add a pure file-reading test that validates .gitignore covers the local
      and generated artifacts relevant to this standalone plugin.
    status: implemented
    changed_file: "tests/test_hermes_tavern_repo_hygiene.py"
    result: "IMPLEMENTED - test asserts required ignore patterns by artifact category without shelling out or touching Gateway/providers"

  - id: S3
    name: "Focused repo hygiene pytest"
    description: >
      Run only the repo hygiene regression test for this release-preflight
      phase.
    verification_command: >
      python -m pytest tests/test_hermes_tavern_repo_hygiene.py -q -o 'addopts='
    status: verified
    result: "PASS - controller rerun 2026-05-31; 1 passed in 0.00s"

  - id: S4
    name: "Full py_compile gate"
    description: >
      Compile the compatibility shim, standalone plugin source, importers, and
      Tavern test modules.
    verification_command: >
      python -m py_compile conftest.py plugins/__init__.py plugins/hermes_tavern/__init__.py src/hermes_tavern/*.py src/hermes_tavern/importers/*.py tests/test_hermes_tavern_*.py
    status: verified
    result: "PASS - controller rerun 2026-05-31; no compile errors"

  - id: S5
    name: "Full Tavern pytest gate"
    description: >
      Run the complete Hermes Tavern test glob after the repo hygiene
      preflight change, without managing Gateway or calling real providers.
    verification_command: >
      python -m pytest tests/test_hermes_tavern_*.py -q -o 'addopts='
    status: verified
    result: "PASS - controller rerun 2026-05-31; 628 passed in 13.74s"

  - id: S6
    name: "Checklist YAML validation"
    description: >
      Validate this CodeStable checklist with the project YAML validator.
    verification_command: >
      python design/codestable/tools/validate-yaml.py --file design/codestable/features/2026-05-31-hermes-tavern-phase90-repo-hygiene-release-preflight/checklist.yaml
    status: verified
    result: "PASS - controller rerun 2026-05-31; 1 file passed, 0 failed"

  - id: S7
    name: "Scoped diff whitespace check"
    description: >
      Check only the files touched by this phase for whitespace errors.
    verification_command: >
      git diff --check -- .gitignore tests/test_hermes_tavern_repo_hygiene.py design/codestable/features/2026-05-31-hermes-tavern-phase90-repo-hygiene-release-preflight/checklist.yaml
    status: verified
    result: "PASS - controller rerun 2026-05-31; no whitespace errors"

implementation_notes: |
  - This phase is repo hygiene / release preflight only.
  - The regression test reads .gitignore from disk and performs no subprocess,
    Gateway, provider, network, ComfyUI, TTS, or credential operations.
  - Existing dirty worktree changes outside these three files are not modified
    by this phase.
