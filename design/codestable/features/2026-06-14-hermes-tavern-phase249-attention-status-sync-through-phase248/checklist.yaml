  - id: static-marker-guard
    status: passed
    owner_mode: controller
    command: |
      PYTHONDONTWRITEBYTECODE=1 python - <<'PY'
      import re
      from pathlib import Path

      attention = Path("design/codestable/attention.md").read_text(encoding="utf-8")
      test_path = Path("tests/test_hermes_tavern_codestable_status.py")
      test = test_path.read_text(encoding="utf-8")

      expected = "Current status (2026-06-14): All phases 1-248 accepted"
      stale = "Current status (2026-06-14): All phases 1-247 accepted"
      append_label = "Phase 248 attention status sync through Phase 247"
      suffix = "Phase 246 attention status sync through Phase 245, Phase 247 attention status sync through Phase 246, and Phase 248 attention status sync through Phase 247."

      status_lines = [line for line in attention.splitlines() if re.match(r"^\s*-\s*Current status ", line)]
      assert len(status_lines) == 1, status_lines
      status = status_lines[0]

      assert status.startswith(f"- {expected}")
      assert stale not in status
      assert re.search(r"(?<!\d)1\-247(?!\d)", status) is None
      assert re.search(r"(?<!\d)1–247(?!\d)", status) is None
      assert re.search(r"(?<!\d)Phase 121-167(?!\d)", status) is not None
      assert append_label in status
      assert status.endswith(suffix)
      assert all(f"Phase {phase} " in status for phase in range(168, 249))

      assert re.findall(r"^CURRENT_STATUS_PREFIX\s*=", test, re.M) == ["CURRENT_STATUS_PREFIX ="]
      assert expected in test
      assert stale in test
      assert append_label in test
      assert suffix in test
      assert "range(168, 249)" in test
      assert "range(168, 248)" in test
      assert all(f"Phase {phase} " in test for phase in range(168, 249))
      for forbidden in [".glob(", ".rglob(", "iterdir(", "os.walk"]:
          assert forbidden not in test, forbidden
      PY

