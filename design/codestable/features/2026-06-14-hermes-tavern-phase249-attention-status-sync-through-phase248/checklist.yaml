  - id: protected-path-guard
    status: passed
    owner_mode: controller
    command: |
      PYTHONDONTWRITEBYTECODE=1 python - <<'PY'
      import fnmatch
      import subprocess

      protected = [
          "run_agent.py",
          "cli.py",
          "gateway/run.py",
          "gateway/**",
          "src/**",
          "plugins/**",
          "build/**",
          "README.md",
          "design/HERMES_TAVERN_DESIGN.md",
          "design/codestable/architecture/**",
          "design/codestable/reference/**",
          "design/codestable/roadmap/**",
          "design/codestable/requirements/**",
          "design/codestable/compound/**",
          "design/codestable/features/2026-06-14-hermes-tavern-phase248-attention-status-sync-through-phase247/**",
      ]
      allowed_phase249 = "design/codestable/features/2026-06-14-hermes-tavern-phase249-attention-status-sync-through-phase248/"

      def lines(cmd):
          return set(filter(None, subprocess.check_output(cmd, text=True).splitlines()))

      changed = set()
      changed |= lines(["git", "diff", "--name-only"])
      changed |= lines(["git", "diff", "--name-only", "--cached"])
      changed |= lines(["git", "ls-files", "--others", "--exclude-standard"])

      violations = []
      for path in changed:
          if path.startswith("design/codestable/features/") and not path.startswith(allowed_phase249):
              violations.append(path)
          for pattern in protected:
              if fnmatch.fnmatch(path, pattern):
                  violations.append(path)
      assert not violations, sorted(set(violations))
      PY

