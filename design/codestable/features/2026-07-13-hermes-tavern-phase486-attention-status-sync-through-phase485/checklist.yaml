verification_commands:
  - id: V1
    owner: executor_observed_then_parent_controller
    status: passed_parent_controller
    command: 'PYTHONDONTWRITEBYTECODE=1 /usr/local/bin/python3 design/codestable/tools/validate-yaml.py --dir design/codestable/features/2026-07-13-hermes-tavern-phase486-attention-status-sync-through-phase485 --require doc_type --require status --require feature'
  - id: V2
    owner: executor_observed_then_parent_controller
    status: passed_parent_controller
    command: >-
      PYTHONDONTWRITEBYTECODE=1 /usr/local/bin/python3 -c
      "import py_compile; py_compile.compile('tests/test_hermes_tavern_codestable_status.py', cfile='/tmp/hermes-tavern-phase486-status-test.pyc', doraise=True)"
  - id: V3
    owner: executor_observed_then_parent_controller
    status: passed_parent_controller
    command: 'TMPDIR=/tmp env -u PYTEST_DISABLE_PLUGIN_AUTOLOAD -u HERMES_SESSION_KEY -u HERMES_SESSION_ID HERMES_HOME=/Users/steven/.hermes PYTHONDONTWRITEBYTECODE=1 /usr/local/bin/python3 -m pytest tests/test_hermes_tavern_codestable_status.py -q -o addopts= -o cache_dir=/tmp/hermes-tavern-phase486-pytest-cache'
  - id: V4
    owner: executor_optional_parent_required
    status: passed_parent_controller
    command: 'TMPDIR=/tmp env -u PYTEST_DISABLE_PLUGIN_AUTOLOAD -u HERMES_SESSION_KEY -u HERMES_SESSION_ID HERMES_HOME=/Users/steven/.hermes PYTHONDONTWRITEBYTECODE=1 /usr/local/bin/python3 -m pytest -q -o addopts= -o cache_dir=/tmp/hermes-tavern-phase486-pytest-cache'
  - id: V5
    owner: parent_controller
    status: passed_parent_controller
    command: |
      set -e
      PYTHONDONTWRITEBYTECODE=1 /usr/local/bin/python3 - <<'PY'
      import re
      import runpy
      import subprocess
      from pathlib import Path

      phase_dir = Path("design/codestable/features/2026-07-13-hermes-tavern-phase486-attention-status-sync-through-phase485")
      allowed = {
          "design/codestable/attention.md",
          "tests/test_hermes_tavern_codestable_status.py",
          str(phase_dir / "design.md"),
          str(phase_dir / "checklist.yaml"),
      }
      acceptance = phase_dir / "acceptance.md"

      def lines_for(*args):
          return subprocess.check_output(args, text=True).splitlines()

      changed = set(lines_for("git", "diff", "--name-only"))
      staged = set(lines_for("git", "diff", "--cached", "--name-only"))
      untracked = set(lines_for("git", "ls-files", "--others", "--exclude-standard"))
      dirty = changed | staged | untracked

      assert staged == set(), staged
      assert dirty == allowed, dirty ^ allowed
      assert not acceptance.exists(), acceptance

      attention_path = Path("design/codestable/attention.md")
      test_path = Path("tests/test_hermes_tavern_codestable_status.py")
      lines = attention_path.read_text(encoding="utf-8").splitlines()
      test_text = test_path.read_text(encoding="utf-8")
      ns = runpy.run_path(str(test_path))
      labels = ns["REQUIRED_PHASE_LABELS"]

      status_lines = [x for x in lines if re.match(r"^\s*-\s*Current status ", x)]
      assert len(status_lines) == 1
      status = status_lines[0]

      other = "### 其他"
      adult = "- Adult-fiction non-negotiable boundaries defined in design doc §12.3 — do not build features that bypass provider safety systems."
      credentials = "### Hermes Tavern 凭证约束"
      assert other in lines
      assert adult in lines
      assert credentials in lines
      assert lines.index(other) < lines.index(adult) < lines.index(status)
      assert lines.index(status) == lines.index(adult) + 1
      assert lines.index(status) < lines.index(credentials)

      assert status.startswith("- Current status (2026-06-18): All phases 1-486 accepted")
      assert status.endswith(
          "Phase 484 attention status sync through Phase 483, "
          "Phase 485 attention status sync through Phase 484, and "
          "Phase 486 attention status sync through Phase 485."
      )

      assert len(labels) == 319
      assert labels[-1] == "Phase 486 attention status sync through Phase 485"
      assert "Phase 485 attention status sync through Phase 484" in labels
      assert all(status.count(label) == 1 for label in labels)
      assert [status.index(label) for label in labels] == sorted(status.index(label) for label in labels)
      assert re.search(r"(?<!\d)Phase 121-167(?!\d)", status) is not None

      assert ns["CURRENT_STATUS_PREFIX"] == "Current status (2026-06-18): All phases 1-486 accepted"
      assert ns["STALE_STATUS_PREFIX"] == "Current status (2026-06-18): All phases 1-485 accepted"
      assert ns["STALE_PHASE_MARKER"] == "1-485"
      assert ns["STALE_PHASE_MARKER_EN_DASH"] == "1–485"
      assert ns["OLDER_STALE_PHASE_MARKER"] == "1-484"
      assert ns["OLDER_STALE_PHASE_MARKER_EN_DASH"] == "1–484"
      assert ns["FINAL_STATUS_SUFFIX"] == (
          "Phase 484 attention status sync through Phase 483, "
          "Phase 485 attention status sync through Phase 484, and "
          "Phase 486 attention status sync through Phase 485."
      )

      assert re.findall(r"^CURRENT_STATUS_PREFIX\s*=", test_text, re.M) == ["CURRENT_STATUS_PREFIX ="]
      assert re.findall(r"^FINAL_STATUS_SUFFIX\s*=", test_text, re.M) == ["FINAL_STATUS_SUFFIX ="]
      assert "phase_range = range(168, 487)" in test_text
      assert 'aggregate_range = "range(168, 487)"' in test_text
      assert "stale_aggregate_range_486" in test_text
      assert "stale_aggregate_guard_486" in test_text
      assert "stale_aggregate_range_485" in test_text
      assert "stale_aggregate_guard_485" in test_text
      assert "assert stale_aggregate_guard_486 not in test" in test_text
      assert 'later_phase_label = f"Phase {phase_range.stop} "' in test_text

      max_phase = max(int(label.split()[1]) for label in labels)
      future_label = f"Phase {max_phase + 1} attention status sync through Phase {max_phase}"
      assert future_label not in status
      assert future_label not in test_text

      forbidden_fragments = [
          ".glob(",
          ".rglob(",
          "iterdir(",
          "os.walk",
      ]
      for fragment in forbidden_fragments:
          assert fragment not in test_text, fragment

      for name in dirty:
          path = Path(name)
          assert path.is_file(), name
          text = path.read_text(encoding="utf-8")
          assert text.endswith("\n"), name
          for number, line in enumerate(text.splitlines(), 1):
              assert line.rstrip() == line, (name, number)
      PY
  - id: V6
    owner: executor_observed_then_parent_controller
    status: passed_parent_controller
    command: git diff --check
  - id: V7
    owner: executor_observed_then_parent_controller
    status: passed_parent_controller
