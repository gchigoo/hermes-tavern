doc_type: feature-checklist
feature: hermes-tavern-phase121-novel-project-layer
date: "2026-06-03"
status: accepted

summary: >
  Novel project layer — projects, chapters, scenes, canon facts, timeline,
  and Markdown export. Last major phase from the original HERMES_TAVERN_DESIGN.md
  is implemented and accepted after controller verification.

steps:
  - id: S0
    name: "Micro-refactor: extract novel DB methods to db_novel.py"
    description: >
      Per design §2.5: Create src/hermes_tavern/db_novel.py with novel-related
      DB methods (NovelDBMixin). Update db.py TavernStore to inherit/compose
      the mixin. Verify no behavioral regressions via full pytest suite.
    status: completed
    completed_at: "2026-06-03"
    exit_signal: "Full pytest suite passes (718+ tests) with zero behavioral diffs"

  - id: S1
    name: "DB schema: 5 novel tables + CRUD methods"
    description: >
      Create novel_projects, novel_chapters, novel_scenes, novel_canon,
      novel_timeline tables with all fields from design §2.1. Implement
      CRUD methods: create/list/get_project, create/list/get_chapter,
      create/list/get/link_scene, create/list/get_canon, get_canon_for_prompt,
      create/list_timeline, export_project_markdown.
    status: completed
    completed_at: "2026-06-03"
    result: >
      IMPLEMENTED - db_novel.NovelDBMixin now owns the five-table novel schema,
      project/chapter/scene/canon/timeline CRUD, scene-session linking, canon
      prompt query ordering, and pure Markdown export. db.py invokes the novel
      schema migration from TavernStore.migrate(). Focused S1 DB tests added in
      tests/test_hermes_tavern_novel_db.py.
    exit_signal: >
      Import TavernStore → create/query project, chapter, scene, canon,
      timeline all return correct dicts; export_project_markdown returns
      non-empty Markdown string

  - id: S2
    name: "Command surface: runtime_novel.py with 5 command families"
    description: >
      Create src/hermes_tavern/runtime_novel.py with handlers for:
      project (create/list/info/set/export), chapter (create/list),
      scene (create/list/start), canon (add/list/group), timeline (add/list).
      Register in COMMAND_TABLE in runtime.py. Use table-driven dispatch
      pattern consistent with existing runtime_*.py modules.
    status: completed
    completed_at: "2026-06-03"
    result: >
      IMPLEMENTED - TAVERN_COMMAND_TABLE now exposes project/chapter/scene/canon/timeline
      command families; TavernRuntime delegates to runtime_novel.py wrappers. The handlers
      support project create/list/info/set, chapter create/list, scene create/list plus a
      deterministic S4-deferred scene start route, canon add/list/group including --group,
      and timeline add/list. README core command docs were updated to keep the command-table
      coverage guard passing.
    exit_signal: >
      /rp project create/list/info/set, /rp chapter create/list, /rp scene create/list/start,
      /rp canon add/list/group, /rp timeline add/list all route deterministically; scene start
      explicitly defers session linking to S4 and project export explicitly defers file writing to S5

  - id: S3
    name: "Canon prompt injection"
    description: >
      In _session_prompt_modules (runtime.py), detect when session is linked
      to a scene→chapter→project chain. Call store.get_canon_for_prompt(project_id)
      and wrap results as PromptModule(role="system", position="after_card",
      insertion_order=between_card_and_presets). Canon modules should appear
      in debug prompt output.
    status: completed
    completed_at: "2026-06-03"
    result: >
      IMPLEMENTED - runtime_prompt_modules.session_canon_modules resolves an
      active session's scene→chapter→project chain via NovelDBMixin.get_project_id_for_session,
      converts get_canon_for_prompt rows into deterministic system PromptModule entries,
      and keeps unlinked, empty-canon, or sqlite DB-error sessions silent so RP prompt
      compilation can continue. Focused debug-prompt tests cover linked inclusion,
      canon-before-preset ordering, unlinked exclusion, and DB-error skip behavior.
    exit_signal: >
      /rp debug prompt with project-linked session shows canon modules
      between card and preset sections

  - id: S4
    name: "Scene-session linking"
    description: >
      /rp scene start <scene> creates a new RP session, associates it with
      the current card, updates scene.session_id, and starts the RP loop.
      /rp session info should display linked project/chapter/scene.
    status: completed
    completed_at: "2026-06-03"
    result: >
      IMPLEMENTED - `/rp scene start <scene-id>` now starts the RP loop
      via the existing `/rp start` behavior, links the scene.session_id through
      store.link_scene_session, and `/rp session info` now shows project/chapter/scene
      context for the active linked session.
    exit_signal: >
      /rp scene start → /rp session info shows "Project: X / Chapter: Y / Scene: Z"

  - id: S5
    name: "Markdown export"
    description: >
      Implement export_project_markdown (in db_novel.py or a new export utility).
      Write to get_hermes_home()/plugins/hermes-tavern/exports/project_{id}.md.
      Return MEDIA:"<path>" format. Structure: title, summary, canon by group,
      timeline by sort_key, chapters→scenes→session messages as dialogue.
    status: completed
    completed_at: "2026-06-03"
    result: >
      IMPLEMENTED - `/rp project export [id]` now writes the Markdown produced by
      `TavernStore.export_project_markdown(project_id)` to
      `get_hermes_home()/plugins/hermes-tavern/exports/project_{project_id}.md`
      and returns a `file:` line plus quoted `MEDIA:"<path>"` marker.
      Added runtime tests for profile-safe export path, file creation, marker parsing,
      Markdown sections, and empty-project export fallback output.
    exit_signal: >
      /rp project export returns MEDIA marker → file exists and contains
      structured Markdown with all sections

  - id: S6
    name: "Tests: unit + integration for novel layer"
    description: >
      Create tests/test_hermes_tavern_novel.py covering:
      - CRUD for all 5 tables (normal + boundary + error paths)
      - Canon injection through _session_prompt_modules
      - Scene-session linking
      - Markdown export structure validation
      - /rp command routing for all novel commands
    status: completed
    completed_at: "2026-06-03"
    result: >
      IMPLEMENTED - consolidated S6 coverage across the existing novel DB/runtime
      test files plus a small session-switch regression guard. Added exact novel
      table-set and blank canon-group defaults, runtime coverage for active-project
      export, chapter counts, scene creation/listing/start errors, missing-project
      errors, linked-session empty-canon prompt behavior, canon DB-error skip behavior,
      and no novel import command help. A tiny runtime_novel.scene_list display fix now
      marks unlinked scenes with "(no session linked)" to satisfy the design §3
      boundary case.
    exit_signal: >
      targeted novel DB/runtime tests and session regression tests pass;
      full pytest suite still green

