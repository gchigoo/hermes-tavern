doc_type: feature-checklist
feature: hermes-tavern-phase91-package-build-artifact-smoke
date: "2026-05-31"
status: implemented

summary: >
  Add a narrow packaging/release preflight smoke that builds Hermes Tavern
  package artifacts into a temporary output directory and inspects the wheel
  and optional sdist contents directly. This phase must not start, reload,
  restart, kill, or manage Gateway, and must not call provider/model, network,
  ComfyUI, TTS, or credential endpoints.

steps:
  - id: S1
    name: "Add package build artifact smoke"
    description: >
      Extend the packaging test module with an offline subprocess build into
      pytest tmp_path. Prefer python -m build when available, fall back to
      pip wheel --no-deps, and inspect wheel/sdist archives without installing
      into the active environment.
    status: implemented
    changed_file: "tests/test_hermes_tavern_packaging.py"
    result: "IMPLEMENTED - added archive inspection for wheel package data, METADATA name/version, and optional sdist source contents"

  - id: S2
    name: "Record Phase91 checklist"
    description: >
      Add this CodeStable checklist for the packaging artifact preflight slice,
      keeping release validation steps explicit and scoped.
    status: implemented
    changed_file: "design/codestable/features/2026-05-31-hermes-tavern-phase91-package-build-artifact-smoke/checklist.yaml"
    result: "IMPLEMENTED - checklist created with focused packaging, compile, pytest, YAML, and diff gates"

  - id: S3
    name: "Focused packaging pytest"
    description: >
      Run only the Hermes Tavern packaging regression module after adding the
      build artifact smoke.
    verification_command: >
      python -m pytest tests/test_hermes_tavern_packaging.py -q -o 'addopts='
    status: verified
    result: "PASS - controller rerun 2026-05-31; 16 passed in 0.59s"

  - id: S4
    name: "Full py_compile gate"
    description: >
      Compile the compatibility shim, standalone plugin source, importers, and
      Tavern test modules.
    verification_command: >
      python -m py_compile conftest.py plugins/__init__.py plugins/hermes_tavern/__init__.py src/hermes_tavern/*.py src/hermes_tavern/importers/*.py tests/test_hermes_tavern_*.py
    status: verified
    result: "PASS - controller rerun 2026-05-31; no compile errors"

  - id: S5
    name: "Full Tavern pytest gate"
    description: >
      Run the complete Hermes Tavern test glob after the packaging artifact
      smoke change, without managing Gateway or calling real providers.
    verification_command: >
      python -m pytest tests/test_hermes_tavern_*.py -q -o 'addopts='
    status: verified
    result: "PASS - controller rerun 2026-05-31; 629 passed in 13.93s"

  - id: S6
    name: "Checklist YAML validation"
    description: >
      Validate this CodeStable checklist with the project YAML validator.
    verification_command: >
      python design/codestable/tools/validate-yaml.py --file design/codestable/features/2026-05-31-hermes-tavern-phase91-package-build-artifact-smoke/checklist.yaml
    status: verified
    result: "PASS - controller rerun 2026-05-31; 1 file passed, 0 failed"

  - id: S7
    name: "Scoped diff whitespace check"
    description: >
      Check only the files in scope for this phase for whitespace errors.
    verification_command: >
      git diff --check -- tests/test_hermes_tavern_packaging.py design/codestable/features/2026-05-31-hermes-tavern-phase91-package-build-artifact-smoke/checklist.yaml pyproject.toml .gitignore
    status: verified
    result: "PASS - controller rerun 2026-05-31; no whitespace errors"

implementation_notes: |
  - This phase is packaging/release preflight only.
  - The artifact smoke builds into pytest tmp_path and inspects archives with
    zipfile/tarfile; it does not install into the active environment.
  - Offline subprocess flags avoid dependency resolution/network access for the
    pip fallback and keep provider/model/Gateway paths untouched.
  - Existing dirty worktree changes outside the packaging test and this
    checklist are not modified by this phase.
  - Codex's first full-suite run hit the known transient image-test provider
    error path. Controller reran focused image tests and the full Tavern glob;
    both passed, so controller-owned verification is the acceptance result.
