risks:
  - id: R1
    risk: >
      The matrix may reveal an existing source-order bug.
    mitigation: >
      Do not fix source in S1; stop and route a separate bug-fix phase with a
      fresh report/analysis/fix artifact.
  - id: R2
    risk: >
      The new tests could duplicate too much per-family CRUD coverage.
    mitigation: >
      Keep assertions focused on cross-family co-presence, ordering, omission,
      and runtime file export behavior only.
  - id: R3
    risk: >
      Runtime export tests can accidentally depend on a real user home path.
    mitigation: >
      Use monkeypatched `HERMES_HOME`/profile-safe temporary paths and keep the
      existing `get_hermes_home()` contract.
  - id: R4
    risk: >
      A test-only slice may drift into documentation or architecture updates.
    mitigation: >
      S1 prohibits docs/source changes; S2 records acceptance only and expects no
      architecture/root-design writeback.

reverse_scope_guards:
  - guard: "No source or protected-core edits"
    command: >-
      git diff --name-only -- run_agent.py cli.py gateway/run.py src
    expected_result: "empty output"
  - guard: "No product docs or architecture writeback in S1"
    command: >-
      git diff --name-only -- README.md design/HERMES_TAVERN_DESIGN.md design/codestable/architecture/ARCHITECTURE.md
    expected_result: "empty output during S1"
  - guard: "No generated build artifact edits"
    command: >-
      git diff --name-only -- build/lib
    expected_result: "empty output"
  - guard: "No broad behavior domains"
    criteria: >
      The diff must not add or modify prompt injection, debug/context-budget
      composition, provider/model routing, content-mode behavior, credentials,
      generation, memory/summarization, retrieval/vectorization, automation,
      media/TTS/image behavior, ST asset import/export, archive import/export,
      relationship graph, relationship rename, or automatic extraction.
  - guard: "Adult-fiction boundary"
    criteria: >
      Test fixtures remain neutral fictional writing metadata and do not include
      minor/underage, school-grade, age-classification, or provider-safety-bypass
      examples.
