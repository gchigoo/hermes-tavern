risks:
  - id: R1
    risk: "Calling individual export functions from within a bundle export could cause import order or name collisions."
    mitigation: "Import and call the existing functions directly with constructed RPCommand objects; do not refactor the individual export functions."
  - id: R2
    risk: "The bundle export could be slow for large projects with many entities."
    mitigation: "Acceptable for a local metadata operation; each individual export is already bounded."
  - id: R3
    risk: "Adding a subcommand could accidentally change existing project_export() routing."
    mitigation: "Add the json branch at the start of project_export() after project_id resolution but before the existing Markdown path; keep Markdown path as default."
  - id: R4
    risk: "The repeated export pattern can tempt a broad refactor."
    mitigation: "Keep S1 to the bounded bundle export command, help, README, and tests. Do not refactor existing export helpers or create new abstractions."
