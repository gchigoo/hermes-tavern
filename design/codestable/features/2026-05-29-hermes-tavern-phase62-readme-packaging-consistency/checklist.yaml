doc_type: feature-checklist
feature: hermes-tavern-phase62-readme-packaging-consistency
date: "2026-05-29"
status: implemented

summary: >
  Add a test-only hardening phase that checks README installation and
  development command references against source packaging metadata. The test
  asserts stable key strings instead of snapshotting the whole README.

steps:
  - id: S1
    name: "Add README packaging consistency regression test"
    description: >
      Extend tests/test_hermes_tavern_packaging.py with a source-only regression
      test that parses pyproject.toml and plugin.yaml, then verifies README.md
      still documents the canonical editable install commands, pytest command,
      display name, and plugin entry_point string.
    status: verified
    changed_file: "tests/test_hermes_tavern_packaging.py"
    result: "PASS - focused README packaging consistency test passed"

  - id: S2
    name: "Focused packaging test run"
    description: >
      Run the packaging test module to verify the Phase 62 test alongside the
      existing standalone packaging checks.
    status: verified
    verification_command: >
      python -m pytest tests/test_hermes_tavern_packaging.py -q -o 'addopts='
    result: "PASS — controller rerun 2026-05-29; 15 passed in 0.13s"

  - id: S3
    name: "py_compile smoke check"
    description: >
      Compile the standalone shim, source, importer, and Tavern test files.
    status: verified
    verification_command: >
      python -m py_compile conftest.py plugins/__init__.py plugins/hermes_tavern/__init__.py src/hermes_tavern/*.py src/hermes_tavern/importers/*.py tests/test_hermes_tavern_*.py
    result: "PASS — controller rerun 2026-05-29; no syntax errors"

  - id: S4
    name: "Full Tavern test suite"
    description: >
      Run the full standalone Tavern pytest glob and record any transient image
      failures without changing unrelated runtime code.
    status: verified
    verification_command: >
      python -m pytest tests/test_hermes_tavern_*.py -q -o 'addopts='
    result: >
      PASS — controller rerun 2026-05-29; 560 passed in 9.55s. Codex's own
      subprocess previously reported 8 transient image-test failures, but the
      controller-owned rerun is green.

  - id: S5
    name: "Checklist YAML validation"
    description: >
      Validate this checklist with the project YAML validator.
    status: verified
    verification_command: >
      python design/codestable/tools/validate-yaml.py --file design/codestable/features/2026-05-29-hermes-tavern-phase62-readme-packaging-consistency/checklist.yaml
    result: "PASS — controller rerun 2026-05-29; 1 file passed, 0 failed"

implementation_notes: |
  - This phase is test-only; no runtime behavior changed.
  - The new test avoids provider calls, secrets, and network access.
  - The assertions are intentionally limited to key metadata and command strings
    that should not drift from pyproject.toml, plugin.yaml, and README.md.
