  - id: static-marker-guard
    status: passed
    owner_mode: controller
    command: |
      PYTHONDONTWRITEBYTECODE=1 python - <<'PY'
      import re
      from pathlib import Path

      attention = Path("design/codestable/attention.md").read_text(encoding="utf-8")
      test_path = Path("tests/test_hermes_tavern_codestable_status.py")
      test = test_path.read_text(encoding="utf-8")

      expected = "Current status (2026-06-15): All phases 1-255 accepted"
      stale = "Current status (2026-06-15): All phases 1-254 accepted"
      append_label = "Phase 255 attention status sync through Phase 254"
      suffix = "Phase 253 attention status sync through Phase 252, Phase 254 attention status sync through Phase 253, and Phase 255 attention status sync through Phase 254."
      stale_range = "range(" + "168" + ", 25" + "5)"

      status_lines = [line for line in attention.splitlines() if re.match(r"^\s*-\s*Current status ", line)]
      assert len(status_lines) == 1, status_lines
      status = status_lines[0]

      assert status.startswith(f"- {expected}")
      assert stale not in status
      assert re.search(r"(?<!\d)1\-254(?!\d)", status) is None
      assert re.search(r"(?<!\d)1–254(?!\d)", status) is None
      assert re.search(r"(?<!\d)Phase 121-167(?!\d)", status) is not None
      assert append_label in status
      assert status.endswith(suffix)
      assert all(f"Phase {phase} " in status for phase in range(168, 256))

      assert 'CURRENT_STATUS_PREFIX = "Current status (2026-06-15): All phases 1-255 accepted"' in test
      assert 'STALE_STATUS_PREFIX = "Current status (2026-06-15): All phases 1-254 accepted"' in test
      assert 'STALE_PHASE_MARKER = "1-254"' in test
      assert 'STALE_PHASE_MARKER_EN_DASH = "1–254"' in test
      assert append_label in test
      assert suffix in test
      assert "range(168, 256)" in test
      assert stale_range not in test
      assert all(f"Phase {phase} " in test for phase in range(168, 256))
      assert re.findall(r"^CURRENT_STATUS_PREFIX\s*=", test, re.M) == ["CURRENT_STATUS_PREFIX ="]
      for forbidden in [".glob(", ".rglob(", "iterdir(", "os.walk"]:
          assert forbidden not in test
      PY

