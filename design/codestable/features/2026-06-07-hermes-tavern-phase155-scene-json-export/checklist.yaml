risks:
  - id: R1
    risk: "Scene ID may be invalid or not found."
    mitigation: "Reject with 'No novel scene found: <id>' (same UX as scene_inspect)."
  - id: R2
    risk: "Scene may be linked to a session; session_id should be included in export."
    mitigation: "Include session_id field (nullable) from novel_scenes row."
  - id: R3
    risk: "Large scene summaries could blow up export payload."
    mitigation: "Summary is stored as text; no auto-summarization or truncation in export (same as existing inspect behavior)."
