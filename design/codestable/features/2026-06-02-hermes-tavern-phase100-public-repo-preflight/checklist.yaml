summary: >
  Prepare Hermes Tavern for publication as a public GitHub repository with a
  license, public-facing README notes, non-deploying CI, patch-placeholder secret
  hygiene, public-readiness tests, and a controller-owned sensitive-information
  scan. This phase does not change runtime, gateway, provider, model, credential,
  network, service, package metadata, or command-table behavior.

steps:
  - id: S1
    name: Add MIT license
    description: >
      Add a standard MIT LICENSE file for the public repository.
    status: implemented
    changed_file: "LICENSE"
    result: "IMPLEMENTED - LICENSE added with holder Hermes Tavern contributors"

  - id: S2
    name: Update README public positioning and safety notes
    description: >
      State beta/experimental status, explain the public positioning as a
      SillyTavern-compatible RP/novel runtime for Hermes Agent gateways, and add
