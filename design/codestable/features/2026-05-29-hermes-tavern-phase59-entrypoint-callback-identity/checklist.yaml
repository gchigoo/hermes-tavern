doc_type: feature-checklist
feature: hermes-tavern-phase59-entrypoint-callback-identity
date: "2026-05-29"
status: implemented

summary: >
  Add package-entrypoint regression tests proving both the canonical standalone
  package and the legacy plugins/ shim register the exact canonical
  hermes_tavern.gateway_hook.pre_gateway_dispatch callback object. This keeps
  plugin loading independent from legacy import aliases while preserving the
  compatibility namespace.

steps:
