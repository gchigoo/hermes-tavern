    name: "Add canonical register callback identity test"
    description: >
      Extend tests/test_hermes_tavern_packaging.py so hermes_tavern.register is
      verified to register the exact hermes_tavern.gateway_hook.pre_gateway_dispatch
      function object with the expected hook name and module path.
    status: verified
    changed_file: "tests/test_hermes_tavern_packaging.py"
    result: "PASS - focused packaging test run passed"

  - id: S2
    name: "Add legacy shim callback identity test"
    description: >
      Verify plugins.hermes_tavern.register continues to delegate to the canonical
      package and wires the same pre_gateway_dispatch object, not a legacy alias.
    status: verified
    changed_file: "tests/test_hermes_tavern_packaging.py"
    result: "PASS - focused packaging test run passed"

  - id: S3
    name: "Focused packaging test run"
    description: >
