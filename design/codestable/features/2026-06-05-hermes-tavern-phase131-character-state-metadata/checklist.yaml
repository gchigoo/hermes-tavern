doc_type: feature-checklist
feature: "2026-06-05-hermes-tavern-phase131-character-state-metadata"
date: "2026-06-05"
status: planned
summary: >
  Character State Metadata v1 will add local project-scoped character notes
  backed by `novel_character_states`, managed through `/rp character state ...`
  commands, optionally visible in Markdown export, and verified to remain outside
  prompt/debug/provider/generation/context-budget/vectorization/retrieval paths.

steps:
  - id: S1
    name: "S1: Character State Metadata implementation"
    status: planned
    description: >
      Add local project-scoped character-state persistence, the `/rp character
      state ...` command family, help/README command literals, optional Markdown
      export visibility, and focused DB/runtime/docs tests. Keep implementation
      inside the allowed plugin/source/docs/test files and avoid prompt/provider/
      model/content-mode/generation paths.
    allowed_files:
      - src/hermes_tavern/db_novel.py
      - src/hermes_tavern/runtime_novel.py
      - src/hermes_tavern/runtime.py
      - src/hermes_tavern/commands.py
      - README.md
      - tests/test_hermes_tavern_novel_db.py
      - tests/test_hermes_tavern_novel_runtime.py
      - tests/test_hermes_tavern_commands.py
      - tests/test_hermes_tavern_readme_docs.py
    exit_signal: >
      Character-state persistence, commands, help/docs, export visibility, and
      no-leak tests pass in focused verification; no protected core, prompt,
      provider, router, credential, content-mode, generation, retrieval/
      vectorization, cloud/collab, minors/underage, ST asset importer/exporter,
      or safety-bypass file changes are present.
    verification:
      - command: >-
          PYTHONDONTWRITEBYTECODE=1 python -m py_compile src/hermes_tavern/db_novel.py src/hermes_tavern/runtime_novel.py src/hermes_tavern/runtime.py src/hermes_tavern/commands.py tests/test_hermes_tavern_novel_db.py tests/test_hermes_tavern_novel_runtime.py tests/test_hermes_tavern_commands.py tests/test_hermes_tavern_readme_docs.py
        owner: executor
      - command: >-
          PYTHONDONTWRITEBYTECODE=1 python -m pytest tests/test_hermes_tavern_novel_db.py tests/test_hermes_tavern_novel_runtime.py tests/test_hermes_tavern_commands.py tests/test_hermes_tavern_readme_docs.py -q -o 'addopts=' -p no:cacheprovider
        owner: executor
      - command: >-
          git diff --name-only -- run_agent.py cli.py gateway/run.py src/hermes_tavern/runtime_prompt_modules.py src/hermes_tavern/prompt.py src/hermes_tavern/runtime_debug.py src/hermes_tavern/model_router.py src/hermes_tavern/provider_bridge.py src/hermes_tavern/adapters.py src/hermes_tavern/runtime_model.py src/hermes_tavern/runtime_generation.py
        owner: executor
      - command: "git diff --check"
        owner: executor

  - id: S2
    name: "S2: Verify/Accept/Write Architecture"
    status: planned
    description: >
      Run focused, plugin, full, YAML/frontmatter, reverse-scope, and whitespace
      verification. Create the acceptance report and update architecture/root
      design to mark character-state metadata current while preserving deferred
      automation/retrieval/provider/generation boundaries.
    allowed_files:
      - design/codestable/features/2026-06-05-hermes-tavern-phase131-character-state-metadata/design.md
      - design/codestable/features/2026-06-05-hermes-tavern-phase131-character-state-metadata/checklist.yaml
      - design/codestable/features/2026-06-05-hermes-tavern-phase131-character-state-metadata/hermes-tavern-phase131-character-state-metadata-acceptance.md
      - design/codestable/architecture/ARCHITECTURE.md
      - design/HERMES_TAVERN_DESIGN.md
    exit_signal: >
      Acceptance report and architecture/root-design writeback are complete, the
      checklist is accepted, and verification confirms the feature remains local
      metadata/export-only.
    verification:
      - command: >-
          PYTHONDONTWRITEBYTECODE=1 python -m pytest tests/test_hermes_tavern_*.py -q -o 'addopts=' -p no:cacheprovider
        owner: controller
      - command: >-
          PYTHONDONTWRITEBYTECODE=1 python -m pytest -q -o 'addopts=' -p no:cacheprovider
        owner: controller
      - command: >-
          python design/codestable/tools/validate-yaml.py --file design/codestable/features/2026-06-05-hermes-tavern-phase131-character-state-metadata/design.md --require doc_type --require status --require feature
        owner: controller
      - command: >-
          python design/codestable/tools/validate-yaml.py --yaml-only --file design/codestable/features/2026-06-05-hermes-tavern-phase131-character-state-metadata/checklist.yaml
        owner: controller
      - command: >-
          git diff --name-only -- run_agent.py cli.py gateway/run.py src/hermes_tavern/runtime_prompt_modules.py src/hermes_tavern/prompt.py src/hermes_tavern/runtime_debug.py src/hermes_tavern/model_router.py src/hermes_tavern/provider_bridge.py src/hermes_tavern/adapters.py src/hermes_tavern/runtime_model.py src/hermes_tavern/runtime_generation.py
        owner: controller
      - command: "git diff --check"
        owner: controller

checks:
  - id: C1
    name: "C1: Active checklist precondition"
    status: pending
    criteria: >
      Before implementation, no unrelated feature checklist is planned, pending,
      or in progress; this Phase 131 checklist is the only active feature.

  - id: C2
    name: "C2: Persistence contract"
    status: pending
    criteria: >
      `novel_character_states` migration, project foreign key/index, CRUD/list
      helpers, missing project/ID behavior, blank-label rejection, and blank-state
      rejection are covered by focused DB tests.

  - id: C3
    name: "C3: Command contract"
    status: pending
    criteria: >
      `/rp character state add/list/inspect/update/delete` command literals
      return compact normal and error messages, support active-project fallback
      for list only, and are visible in help/README command surfaces.

  - id: C4
    name: "C4: Markdown export"
    status: pending
    criteria: >
      Project Markdown export includes `## Characters` only when character-state
      rows exist, orders it after Style Guide and before Relationships/Chapters,
      and omits it for projects without character-state rows.

  - id: C5
    name: "C5: Offline no-leak boundary"
    status: pending
    criteria: >
      Character-state text does not appear in `/rp debug prompt` or
      `/rp debug context`; prompt module selection, provider calls, model routing,
      content mode, credentials, generation, vectorization/retrieval, and
      summarization behavior remain unchanged.

  - id: C6
    name: "C6: Reverse-scope verification"
    status: pending
    criteria: >
      No protected core files, build artifacts, provider/model/generation files,
      credential paths, cloud/collab paths, minors/underage paths, ST asset
      importer/exporter paths, or provider-safety bypass behavior are changed.
