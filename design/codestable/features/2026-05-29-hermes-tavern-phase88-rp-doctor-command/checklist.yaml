doc_type: feature-checklist
feature: hermes-tavern-phase88-rp-doctor-command
date: "2026-05-29"
status: implemented

summary: >
  Add a deterministic offline /rp doctor command for pre-installation smoke
  diagnostics. The command reports current-scope session state, asset counts,
  stable provider/configuration labels, and a next-step hint without making
  provider, model, network, ComfyUI, or filesystem-write calls.

steps:
  - id: S1
    name: "Add doctor command dispatch"
    description: >
      Add /rp doctor to the table-driven command help output and dispatch it
      through TavernRuntime._doctor(event).
    status: verified
    changed_file: "src/hermes_tavern/commands.py; src/hermes_tavern/runtime.py"
    result: "PASS - /rp doctor registered in help and delegated through runtime_debug.doctor"

  - id: S2
    name: "Implement offline diagnostic report"
    description: >
      Implement hermes_tavern.runtime_debug.doctor(runtime, event) with
      defensive current-scope active/paused session lookup, db path reporting,
      asset counts, model mode, image provider class/name, tts yes/no, and
      import/start/resume hints. Store and event errors must return sanitized
      unknown/error values instead of the generic internal error.
    status: verified
    changed_file: "src/hermes_tavern/runtime_debug.py"
    result: "PASS - helper added with no provider/model/network/ComfyUI calls and no session enumeration across scopes"

  - id: S3
    name: "Add focused doctor regressions"
    description: >
      Cover no active session counts and import/start hint, active same-scope
      id/card reporting without other-scope leaks, paused same-scope id/card
      reporting with resume hint and no other-scope leaks, broken event/store
      tolerance, and help output.
    status: verified
    changed_file: "tests/test_hermes_tavern_doctor.py"
    result: "PASS - focused Phase88 regression file added"

  - id: S4
    name: "Focused doctor and command pytest"
    description: >
      Run the doctor regressions plus command table tests.
    verification_command: >
      python -m pytest tests/test_hermes_tavern_doctor.py tests/test_hermes_tavern_commands.py -q -o 'addopts='
    status: verified
    result: "PASS - controller rerun 2026-05-30; 21 passed in 0.14s"

  - id: S5
    name: "Checklist YAML validation"
    description: >
      Validate this CodeStable checklist with the project YAML validator.
    verification_command: >
      python design/codestable/tools/validate-yaml.py --file design/codestable/features/2026-05-29-hermes-tavern-phase88-rp-doctor-command/checklist.yaml
    status: verified
    result: "PASS - controller rerun 2026-05-30; 1 file passed, 0 failed"

  - id: S6
    name: "Full py_compile gate"
    description: >
      Compile the standalone plugin source, importers, compatibility shim, and
      Tavern test modules.
    verification_command: >
      python -m py_compile conftest.py plugins/__init__.py plugins/hermes_tavern/__init__.py src/hermes_tavern/*.py src/hermes_tavern/importers/*.py tests/test_hermes_tavern_*.py
    status: verified
    result: "PASS - controller rerun 2026-05-30; no compile errors"

  - id: S7
    name: "Full Tavern pytest gate"
    description: >
      Run the complete Hermes Tavern test glob after the Phase88 doctor command.
    verification_command: >
      python -m pytest tests/test_hermes_tavern_*.py -q -o 'addopts='
    status: verified
    result: "PASS - controller rerun 2026-05-30; 624 passed in 14.44s"

implementation_notes: |
  - The doctor command reads only current-scope active/paused rows and aggregate
    asset counts. It does not list sessions, titles, cards, or scope keys from
    other scopes.
  - Production source uses canonical hermes_tavern.* imports only.
  - Image diagnostics inspect the configured provider object class/name only;
    generate() is never called.
