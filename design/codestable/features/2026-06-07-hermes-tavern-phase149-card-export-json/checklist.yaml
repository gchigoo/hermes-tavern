      - command: "PYTHONDONTWRITEBYTECODE=1 python -m py_compile src/hermes_tavern/commands.py src/hermes_tavern/runtime_assets.py tests/test_hermes_tavern_card_export.py tests/test_hermes_tavern_commands.py tests/test_hermes_tavern_readme_docs.py"
