      import fnmatch
      import subprocess
      import sys

      allowed = {
          "design/codestable/attention.md",
          "tests/test_hermes_tavern_codestable_status.py",
          "design/codestable/features/2026-06-14-hermes-tavern-phase228-attention-status-sync-through-phase227/design.md",
