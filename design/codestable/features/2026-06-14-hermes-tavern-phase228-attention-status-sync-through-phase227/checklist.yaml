          "run_agent.py",
          "cli.py",
          "gateway/**",
          "src/**",
          "plugins/**",
          "build/**",
          "build/lib/**",
          "README.md",
          "design/HERMES_TAVERN_DESIGN.md",
          "design/codestable/architecture/**",
          "design/codestable/reference/**",
          "design/codestable/roadmap/**",
          "design/codestable/requirements/**",
          "design/codestable/compound/**",
      ]

      raw = subprocess.check_output(
          ["git", "status", "--porcelain=v1", "--untracked-files=all"],
          text=True,
      ).splitlines()
      changed = set()
      for line in raw:
          path = line[3:]
          if " -> " in path:
              changed.update(path.split(" -> "))
          else:
              changed.add(path)

      extra = sorted(changed - allowed)
      protected_hits = sorted(
          path for path in changed
          if any(fnmatch.fnmatch(path, pattern) for pattern in protected)
      )
      overlap = sorted(allowed.intersection(
          path for pattern in protected for path in allowed if fnmatch.fnmatch(path, pattern)
      ))

      if extra or protected_hits or overlap:
          print({"extra": extra, "protected_hits": protected_hits, "allowed_protected_overlap": overlap})
          sys.exit(1)
      PY
