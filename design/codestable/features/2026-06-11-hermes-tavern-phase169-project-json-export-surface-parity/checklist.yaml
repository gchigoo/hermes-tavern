      - "Add `/rp project export json [project-id]` to the root design Commands block near `/rp project export [id]`."
      - "Add `/rp project export json [project-id]` to the architecture current `/rp` command surface near `/rp project create/list/info/set/export`."
      - "Add one exact `_build_help_text()` assertion for `/rp project export json [project-id]` in `tests/test_hermes_tavern_commands.py`."
      - "Do not change runtime handlers, JSON export payloads, README text, schemas, provider/model routing, generation behavior, prompt compiler, gateway/core, archive/ZIP/retrieval/vectorization, or plugin assets."
