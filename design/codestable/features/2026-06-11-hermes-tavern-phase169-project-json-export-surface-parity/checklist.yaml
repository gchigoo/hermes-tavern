      - command: "python -m pytest tests/test_hermes_tavern_commands.py tests/test_hermes_tavern_readme_docs.py -q -o 'addopts='"
        expected: "passes"
      - command: 'rg -n "/rp project export json \[project-id\]" README.md src/hermes_tavern/commands.py design/HERMES_TAVERN_DESIGN.md design/codestable/architecture/ARCHITECTURE.md tests/test_hermes_tavern_commands.py tests/test_hermes_tavern_readme_docs.py'
        expected: "shows the literal in source help, README, root design, architecture, and tests"
  - id: S2
    name: "S2: Verify/accept/write current docs"
    status: planned
    description: >
      Controller-owned acceptance/writeback after S1 passes.
    allowed_files:
      - design/codestable/features/2026-06-11-hermes-tavern-phase169-project-json-export-surface-parity/checklist.yaml
      - design/codestable/features/2026-06-11-hermes-tavern-phase169-project-json-export-surface-parity/phase169-acceptance.md
      - design/codestable/architecture/ARCHITECTURE.md
      - design/HERMES_TAVERN_DESIGN.md
    prohibited_files:
      - README.md
      - "src/**"
      - "tests/**"
