doc_type: feature-checklist
feature: hermes-tavern-phase50-version-attribute
date: "2026-05-29"
status: implemented

summary: >
  Add __version__ attribute to hermes_tavern package using importlib.metadata, and
  enrich pyproject.toml with PEP 566 classifiers and keywords. __version__ is the
  standard Python packaging contract: consumers can check hermes_tavern.__version__
  instead of reading pyproject.toml. Classifiers improve PyPI discoverability and
  signal language/license/status clearly. No runtime behavior changes.

steps:
  - id: S1
    name: "Add __version__ via importlib.metadata"
    description: >
      In src/hermes_tavern/__init__.py add a __version__ attribute using
      importlib.metadata.version("hermes-tavern"). Fall back to "0.0.0.dev0" if
      PackageNotFoundError is raised (e.g. source checkout without editable install).
      This follows the modern Python packaging convention per PEP 566.
    status: verified
    changed_file: "src/hermes_tavern/__init__.py"
    result: "PASS — 2026-05-29; hermes_tavern.__version__ == '0.1.0' (matches importlib.metadata)"

  - id: S2
    name: "Add classifiers and keywords to pyproject.toml"
    description: >
      Add classifiers (Programming Language, License, Development Status, Intended
      Audience, Operating System) and keywords to [project] in pyproject.toml.
      These are PEP 621 metadata-only fields; they have no effect on runtime or
      imports but are required for a production-quality PyPI package.
    status: verified
    changed_file: "pyproject.toml"
    result: "PASS — 2026-05-29; classifiers (5 entries) and keywords added to [project]"

  - id: S3
    name: "Add __version__ test"
    description: >
      Add test_version_attribute_matches_package_metadata in
      tests/test_hermes_tavern_packaging.py. Verifies that hermes_tavern.__version__
      is a non-empty string and equals importlib.metadata.version("hermes-tavern").
    status: verified
    changed_file: "tests/test_hermes_tavern_packaging.py"
    result: "PASS — 2026-05-29; test_version_attribute_matches_package_metadata passes"

  - id: S4
    name: "py_compile smoke check"
    description: >
      Compile all shim, source, importer, and test files to confirm no syntax errors.
    status: verified
    verification_command: >
      python -m py_compile conftest.py plugins/__init__.py plugins/hermes_tavern/__init__.py src/hermes_tavern/*.py src/hermes_tavern/importers/*.py tests/test_hermes_tavern_*.py
    result: "PASS — 2026-05-29; no syntax errors"

  - id: S5
    name: "Full test suite"
    description: >
      Run the full standalone Tavern pytest glob to verify no regressions.
      Expect 448 passed (was 447; +1 new __version__ test).
    status: verified
    verification_command: >
      python -m pytest tests/test_hermes_tavern_*.py -q -o 'addopts='
    result: "PASS — 2026-05-29; 448 passed in 9.34s (was 447; +1 new __version__ test)"

  - id: S6
    name: "Checklist YAML validation"
    description: >
      Validate this checklist with the project YAML validator.
    status: verified
    verification_command: >
      python design/codestable/tools/validate-yaml.py --file design/codestable/features/2026-05-29-hermes-tavern-phase50-version-attribute/checklist.yaml
    result: "PASS — 2026-05-29; 1 file passed, 0 failed"

implementation_notes: |
  - __version__ fallback to "0.0.0.dev0" guards against running from a raw
    source checkout (no editable install) where importlib.metadata would raise
    PackageNotFoundError. This is the canonical pattern from packaging.python.org.
  - pyproject.toml classifiers use the trove-classifiers vocabulary; they are
    purely informational for PyPI and build tools, no runtime effect.
  - No runtime source files other than __init__.py are modified.
