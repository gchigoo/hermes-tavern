- id: V5
  name: static status guards
  owner: parent-controller
  status: passed
  command: |
    PYTHONDONTWRITEBYTECODE=1 python - <<'PY'
    import re
    from pathlib import Path

    attention = Path("design/codestable/attention.md").read_text(encoding="utf-8")
    test = Path("tests/test_hermes_tavern_codestable_status.py").read_text(encoding="utf-8")
    status_lines = [line for line in attention.splitlines() if re.match(r"^\s*-\s*Current status ", line)]
    assert len(status_lines) == 1
    status = status_lines[0]

    attention_suffix = "Phase 322 attention status sync through Phase 321, Phase 323 attention status sync through Phase 322, and Phase 324 attention status sync through Phase 323."
    final_suffix = "Phase 304 attention status sync through Phase 303, Phase 305 attention status sync through Phase 304, Phase 306 attention status sync through Phase 305, Phase 307 attention status sync through Phase 306, Phase 308 attention status sync through Phase 307, Phase 309 attention status sync through Phase 308, Phase 310 attention status sync through Phase 309, Phase 311 attention status sync through Phase 310, Phase 312 attention status sync through Phase 311, Phase 313 attention status sync through Phase 312, Phase 314 attention status sync through Phase 313, Phase 315 attention status sync through Phase 314, Phase 316 attention status sync through Phase 315, Phase 317 attention status sync through Phase 316, Phase 318 attention status sync through Phase 317, Phase 319 attention status sync through Phase 318, Phase 320 attention status sync through Phase 319, Phase 321 attention status sync through Phase 320, Phase 322 attention status sync through Phase 321, Phase 323 attention status sync through Phase 322, and Phase 324 attention status sync through Phase 323."

    assert status.startswith("- Current status (2026-06-18): All phases 1-324 accepted")
    assert "Current status (2026-06-18): All phases 1-323 accepted" not in status
    assert re.search(r"(?<!\d)1-323(?!\d)", status) is None
    assert re.search(r"(?<!\d)1–323(?!\d)", status) is None
    assert status.count("Phase 324 attention status sync through Phase 323") == 1
    assert "Phase 325 attention status sync" not in status
    assert status.endswith(attention_suffix)
    assert re.search(r"(?<!\d)Phase 121-167(?!\d)", status) is not None
    assert all(f"Phase {phase} " in status for phase in range(168, 325))

    assert 'CURRENT_STATUS_PREFIX = "Current status (2026-06-18): All phases 1-324 accepted"' in test
    assert 'STALE_STATUS_PREFIX = "Current status (2026-06-18): All phases 1-323 accepted"' in test
    assert 'STALE_PHASE_MARKER = "1-323"' in test
    assert 'STALE_PHASE_MARKER_EN_DASH = "1–323"' in test
    assert test.count('"Phase 324 attention status sync through Phase 323"') == 1
    assert "Phase 325 attention status sync" not in test
    assert f'FINAL_STATUS_SUFFIX = "{final_suffix}"' in test
    assert "phase_range = range(168, 325)" in test
    assert 'aggregate_range = "range(168, 325)"' in test
    assert "stale_aggregate_range_324" in test
    assert '"32", "4", ")"' in test
    for guard in ("stale_aggregate_range_323", "stale_aggregate_range_322", "stale_aggregate_range_321", "stale_aggregate_range_320", "stale_aggregate_range_319", "stale_aggregate_range_318"):
        assert guard in test
    assert re.findall(r"^CURRENT_STATUS_PREFIX\s*=", test, re.M) == ["CURRENT_STATUS_PREFIX ="]
    for token in ("." + "glob" + "(", "." + "rgl" + "ob" + "(", "iter" + "dir(", "os" + "." + "walk"):
        assert token not in test
    PY
- id: V6
  name: allowlist guard
  owner: parent-controller
  status: passed
  command: |
    PYTHONDONTWRITEBYTECODE=1 python - <<'PY'
    import subprocess

    allowed = {
        "design/codestable/attention.md",
        "tests/test_hermes_tavern_codestable_status.py",
        "design/codestable/features/2026-06-23-hermes-tavern-phase324-attention-status-sync-through-phase323/design.md",
        "design/codestable/features/2026-06-23-hermes-tavern-phase324-attention-status-sync-through-phase323/checklist.yaml",
        "design/codestable/features/2026-06-23-hermes-tavern-phase324-attention-status-sync-through-phase323/acceptance.md",
    }
    output = subprocess.check_output(["git", "status", "--short"], text=True)
    bad = []
    for line in output.splitlines():
        path = line[3:].strip()
        if " -> " in path:
            path = path.split(" -> ", 1)[1]
        if path and path not in allowed:
            bad.append(line)
    assert not bad, "\n".join(bad)
    PY
