static_marker_guard:
  current_status_prefix: "Current status (2026-06-15): All phases 1-271 accepted"
  stale_status_prefix: "Current status (2026-06-15): All phases 1-270 accepted"
  stale_terminal_markers:
    - "1-270"
    - "1–270"
  required_valid_internal_marker: "Phase 121-167"
  required_label_range: "168..271"
  final_status_suffix: "Phase 269 attention status sync through Phase 268, Phase 270 attention status sync through Phase 269, and Phase 271 attention status sync through Phase 270."
  current_status_prefix_assignment_count: 1
  required_aggregate_range_literal: "range(168, 272)"
  stale_aggregate_range_literal_to_reject_without_embedding: "range(168, 271)"
  forbidden_discovery_tokens:
    - ".glob("
    - ".rglob("
    - "iterdir("
    - "os.walk"

