implementation_notes: |
  - Scope is limited to SECURITY.md, CONTRIBUTING.md,
    .github/ISSUE_TEMPLATE/config.yml, tests/test_hermes_tavern_repo_hygiene.py,
    and this checklist.
  - This phase does not change runtime, provider, gateway, model, network,
    credential behavior, package metadata, plugin/runtime code, workflows,
    README.md, or pyproject.toml.
  - SECURITY.md does not promise GitHub private vulnerability reporting is already
    enabled; it explains the current public-beta reporting path and redaction
    expectations.

