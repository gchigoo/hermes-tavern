doc_type: feature-checklist
feature: hermes-tavern-phase105-public-security-reporting-policy
date: "2026-06-02"
status: implemented

summary: >
  Add a public security reporting policy, route security-sensitive reports from
  CONTRIBUTING.md and issue templates, and extend repository-hygiene checks to
  verify policy presence, links, and offline-safe language.

steps:
  - id: S1
    name: Add SECURITY.md reporting policy
    description: >
      Add a public SECURITY.md policy covering current public-beta scope, what to
      report, safe/public-vs-sensitive reporting paths, offline validation
      expectations, redaction guidance, and no private vulnerability reporting
      promises unless explicitly available.
    status: implemented
    changed_file: "SECURITY.md"
    result: "IMPLEMENTED - SECURITY.md added"

  - id: S2
    name: Link CONTRIBUTING.md to SECURITY.md
    description: >
      Update CONTRIBUTING.md to reference SECURITY.md in a dedicated security
      handling section and direct sensitive reporters there.
    status: implemented
    changed_file: "CONTRIBUTING.md"
    result: "IMPLEMENTED - CONTRIBUTING.md includes security reporting handoff"

  - id: S3
    name: Add security policy contact link in issue template config
    description: >
      Update .github/ISSUE_TEMPLATE/config.yml to add a SECURITY.md contact link
      while preserving blank issues and CONTRIBUTING.md link.
    status: implemented
    changed_file: ".github/ISSUE_TEMPLATE/config.yml"
    result: "IMPLEMENTED - issue template config now includes SECURITY.md"

  - id: S4
    name: Extend repo hygiene tests for public security policy
    description: >
      Add assertions for SECURITY.md existence and required concepts, CONTRIBUTING
      and config contact-link wiring, and ensure policy/config files do not include
      operational runtime command patterns or credential-sharing instructions.
    status: implemented
    changed_file: "tests/test_hermes_tavern_repo_hygiene.py"
    result: "IMPLEMENTED - policy coverage and anti-pattern checks added"

  - id: S5
    name: Run focused repo-hygiene verification
    description: >
      Run the focused repo-hygiene pytest suite that now covers this phase's
      policy assertions.
    verification_command: >
      PYTHONDONTWRITEBYTECODE=1 python -m pytest tests/test_hermes_tavern_repo_hygiene.py -q -o 'addopts='
    status: verified
    result: "PASS - controller rerun returned 18 passed in 0.05s"

  - id: S6
    name: Run public docs + packaging verification
    description: >
      Re-run public docs and packaging checks for cross-phase readiness.
    verification_command: >
      PYTHONDONTWRITEBYTECODE=1 python -m pytest tests/test_hermes_tavern_readme_docs.py tests/test_hermes_tavern_packaging.py -q -o 'addopts='
    status: verified
