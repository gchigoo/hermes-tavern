doc_type: feature-checklist
feature: "2026-06-03-hermes-tavern-phase122-scene-goals"
status: in_progress
summary: >
  Scene Goals v1 adds persistent scene goals, a narrow /rp scene goal command,
  active-session prompt injection, and export/docs visibility.

steps:
  - id: S1
    name: "DB contract: scene goal persistence"
    status: completed
    completed_at: "2026-06-03"
    result: >
      IMPLEMENTED - db_novel.NovelDBMixin now migrates novel_scene_goals,
      exposes set/get/clear scene goal helpers, validates missing parent scenes
      with ValueError("Scene not found"), updates repeated scene-goal writes in
      place, clears deterministically by deleting the row, and resolves linked
      session goals through novel_scenes.session_id. Focused DB tests cover
      migration, set/update/get/clear behavior, missing-scene errors, and
      linked-session scoping.
    description: >
      Add the novel_scene_goals table to db_novel.py plus set/get/clear and
      get_scene_goal_for_session helpers. Extend novel DB tests for migration,
      parent validation, update semantics, clear semantics, and linked-session lookup.
    verification:
      - command: "PYTHONDONTWRITEBYTECODE=1 python -m py_compile src/hermes_tavern/db_novel.py tests/test_hermes_tavern_novel_db.py"
        result: "passed (controller rerun after S1 implementation)"
      - command: "PYTHONDONTWRITEBYTECODE=1 python -m pytest tests/test_hermes_tavern_novel_db.py -q -o 'addopts='"
        result: "passed; 10 passed in 0.36s (controller rerun after S1 implementation)"

  - id: S2
    name: "Command surface: scene goal set inspect clear"
    status: completed
    completed_at: "2026-06-03"
    result: >
      IMPLEMENTED - runtime_novel.scene_command now routes /rp scene goal to a
      bounded scene_goal helper for set, inspect, and explicit clear. The helper
      uses S1 store methods, maps missing scenes to a bounded "No novel scene
      found" response, rejects missing/non-numeric ids and blank set text with
      usage, and previews goal text with mobile_preview. commands.py help lists
      both scene-goal forms, and focused runtime tests cover help, set/update,
      inspect, clear, usage, blank text, non-numeric ids, and missing-scene
      errors.
    description: >
      Add /rp scene goal <scene-id> [text] and /rp scene goal clear <scene-id>
      under runtime_novel.py. Update commands.py help and runtime tests for usage,
      missing scene, set, inspect, and clear.
    verification:
      - command: "PYTHONDONTWRITEBYTECODE=1 python -m py_compile src/hermes_tavern/runtime_novel.py src/hermes_tavern/commands.py tests/test_hermes_tavern_novel_runtime.py"
        result: "passed (controller rerun after S2 implementation)"
      - command: "PYTHONDONTWRITEBYTECODE=1 python -m pytest tests/test_hermes_tavern_novel_runtime.py -q -o 'addopts='"
        result: "passed; 28 passed in 0.90s (controller rerun after S2 implementation)"
      - command: "PYTHONDONTWRITEBYTECODE=1 python -m pytest tests/test_hermes_tavern_novel_db.py tests/test_hermes_tavern_novel_runtime.py -q -o 'addopts='"
        result: "passed; 38 passed in 1.31s"

  - id: S3
    name: "Prompt module: active linked scene goal"
    status: completed
    completed_at: "2026-06-03"
    result: >
      IMPLEMENTED - runtime_prompt_modules.session_prompt_modules now includes
      session_scene_goal_modules before author-note modules. The helper resolves
      the active session's linked scene goal via get_scene_goal_for_session,
      skips missing/blank goals and sqlite lookup errors, resolves the scene
      title for a system scene_goal:<scene title> module, and injects content as
      "Scene goal: <goal text>" with before_user/insertion_order 70. Focused
      runtime debug-prompt tests cover linked inclusion, non-linked exclusion,
      sqlite-error skip behavior, and scene-goal ordering before note:author.
    description: >
      Add session_scene_goal_modules in runtime_prompt_modules.py. Inject a
      system scene_goal module only for the active session linked to a scene
      with a non-empty goal. Skip cleanly on sqlite errors.
    verification:
      - command: "PYTHONDONTWRITEBYTECODE=1 python -m py_compile src/hermes_tavern/runtime_prompt_modules.py tests/test_hermes_tavern_novel_runtime.py"
        result: "passed (controller rerun after S3 implementation)"
      - command: "PYTHONDONTWRITEBYTECODE=1 python -m pytest tests/test_hermes_tavern_novel_runtime.py -k 'scene_goal' -q -o 'addopts='"
        result: "passed; 12 passed, 19 deselected in 0.44s"
      - command: "PYTHONDONTWRITEBYTECODE=1 python -m pytest tests/test_hermes_tavern_novel_runtime.py -q -o 'addopts='"
        result: "passed; 31 passed in 0.98s"

  - id: S4
    name: "Export and docs: scene goal visibility"
    status: completed
    completed_at: "2026-06-03"
    result: >
      IMPLEMENTED - project Markdown export now prints non-empty scene goals as
      "Goal: <text>" directly under the relevant scene heading and before any
      exported scene messages or no-session/no-message placeholder. README core
      commands expose both /rp scene goal forms, and focused DB/runtime/docs tests
      lock the export and documentation visibility contract.
    description: >
      Include scene goals in project Markdown export under the relevant scene.
      Update README command surface. Do not add project/novel import or archive formats.
    verification:
      - command: "PYTHONDONTWRITEBYTECODE=1 python -m py_compile src/hermes_tavern/db_novel.py tests/test_hermes_tavern_novel_db.py tests/test_hermes_tavern_novel_runtime.py tests/test_hermes_tavern_readme_docs.py"
        result: "passed (controller rerun after S4 implementation)"
