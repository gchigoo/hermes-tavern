doc_type: feature-checklist
feature: hermes-tavern-phase67-export-media-delivery
date: "2026-05-29"
status: implemented

summary: >
  Add a low-risk gateway media delivery contract proving Tavern export
  responses with MEDIA markers do not leak raw markers into chat text and are
  still routed through the gateway media delivery helper.

steps:
  - id: S1
    name: "Add export media gateway hook contract"
    description: >
      Extend the gateway hook tests with an active-session /rp export dispatch
      through pre_gateway_dispatch. The test uses in-process fakes only and
      asserts the chat adapter receives cleaned text while the gateway media
      helper receives the original response containing the quoted MEDIA marker.
    status: verified
    changed_file: "tests/test_hermes_tavern_gateway_hook.py"
    result: "PASS - focused gateway hook media contract passed"

  - id: S2
    name: "Focused gateway media tests"
    description: >
      Run the gateway hook and gateway dispatch modules to verify existing
      Telegram/mobile hook behavior plus the new export MEDIA delivery contract.
    verification_command: >
      python -m pytest tests/test_hermes_tavern_gateway.py tests/test_hermes_tavern_gateway_hook.py -q -o 'addopts='
    status: verified
    result: "PASS — controller rerun 2026-05-29; 20 passed in 0.45s"

  - id: S3
    name: "py_compile smoke check"
    description: >
      Compile the standalone shim, source modules, importer modules, and Tavern
      tests without changing runtime/provider behavior.
    verification_command: >
      python -m py_compile conftest.py plugins/__init__.py plugins/hermes_tavern/__init__.py src/hermes_tavern/*.py src/hermes_tavern/importers/*.py tests/test_hermes_tavern_*.py
    status: verified
    result: "PASS — controller rerun 2026-05-29; no syntax errors"

  - id: S4
    name: "Full Tavern test suite"
    description: >
      Run the full standalone Tavern pytest glob and record any transient image
      failures honestly without changing unrelated runtime/provider code.
    verification_command: >
      python -m pytest tests/test_hermes_tavern_*.py -q -o 'addopts='
    status: verified
    result: >
      PASS — controller rerun 2026-05-29; 566 passed in 9.74s. Codex's own
      subprocess previously reported 8 transient image-test failures, but the
      controller-owned rerun is green.

  - id: S5
    name: "Checklist YAML validation"
    description: >
      Validate this checklist with the project YAML validator.
    verification_command: >
      python design/codestable/tools/validate-yaml.py --file design/codestable/features/2026-05-29-hermes-tavern-phase67-export-media-delivery/checklist.yaml
    status: verified
    result: "PASS — controller rerun 2026-05-29; 1 file passed, 0 failed"

implementation_notes: |
  - This phase is test-only; no production runtime behavior changed.
