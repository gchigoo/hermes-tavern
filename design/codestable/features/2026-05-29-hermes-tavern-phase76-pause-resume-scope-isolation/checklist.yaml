doc_type: feature-checklist
feature: hermes-tavern-phase76-pause-resume-scope-isolation
date: "2026-05-29"
status: implemented

summary: >
  Add focused command-level regression coverage for /rp pause and /rp resume
  scope isolation. Pause and resume must only mutate the caller's current
  scope, and ordinary no-active/no-paused responses must not disclose or mutate
  another user or platform scope.

steps:
  - id: S1
    name: "Add pause/resume isolation regressions"
    description: >
      Extend tests/test_hermes_tavern_session_browser.py with cross-user and
      cross-platform coverage for /rp pause and /rp resume. The caller's
      active session must move to paused without affecting another active
      scope, the caller's paused session must move to active without affecting
      another paused scope, and no-active/no-paused caller responses must not
      expose other-scope ids, short ids, titles, or scope keys.
    status: verified
    changed_file: "tests/test_hermes_tavern_session_browser.py"
    result: "PASS - Codex focused Phase76 regressions passed"

  - id: S2
    name: "Focused pause/resume pytest"
    description: >
      Run the focused session browser regressions covering /rp pause and
      /rp resume same-scope behavior, cross-user isolation, and cross-platform
      no-active/no-paused isolation.
    verification_command: >
      python -m pytest tests/test_hermes_tavern_session_browser.py -q -o 'addopts=' -k 'pause or resume'
    status: verified
    result: "PASS - Codex run 2026-05-29; 8 passed, 59 deselected in 0.29s"

  - id: S3
    name: "Focused session isolation pytest"
    description: >
      Run the session browser and direct session store tests covering the
      command-level regressions and existing pause/resume store behavior.
    verification_command: >
      python -m pytest tests/test_hermes_tavern_session_browser.py tests/test_hermes_tavern_sessions.py -q -o 'addopts='
    status: verified
    result: "PASS - controller rerun 2026-05-29; 76 passed in 1.96s"

  - id: S4
    name: "Full py_compile gate"
    description: >
      Compile the standalone plugin source, importers, compatibility shim, and
      Tavern test modules.
    verification_command: >
      python -m py_compile conftest.py plugins/__init__.py plugins/hermes_tavern/__init__.py src/hermes_tavern/*.py src/hermes_tavern/importers/*.py tests/test_hermes_tavern_*.py
    status: verified
    result: "PASS - controller rerun 2026-05-29; no compile errors"

  - id: S5
    name: "Full Tavern pytest gate"
    description: >
      Run the complete Hermes Tavern test glob after the pause/resume scope
      isolation regressions.
    verification_command: >
      python -m pytest tests/test_hermes_tavern_*.py -q -o 'addopts='
    status: verified
    result: "PASS - controller rerun 2026-05-29; 589 passed in 10.30s"

  - id: S6
    name: "Checklist YAML validation"
    description: >
      Validate this CodeStable checklist with the project YAML validator.
    verification_command: >
      python design/codestable/tools/validate-yaml.py --file design/codestable/features/2026-05-29-hermes-tavern-phase76-pause-resume-scope-isolation/checklist.yaml
    status: verified
    result: "PASS - controller rerun 2026-05-29; 1 file passed, 0 failed"

implementation_notes: |
  - This phase is test-only; no source/runtime/provider code changed.
  - The regressions use local sqlite stores and do not introduce secrets, real
    provider calls, model calls, network calls, or production imports from
    plugins.hermes_tavern under src/hermes_tavern/.
