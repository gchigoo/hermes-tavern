doc_type: feature-checklist
feature: hermes-tavern-phase73-stop-scope-isolation
date: "2026-05-29"
status: implemented

summary: >
  Add focused regression coverage for stop-like session termination commands.
  Existing Hermes Tavern semantics use /rp end and /rp archive rather than
  /rp stop; both commands must only mutate the caller's current scope and must
  not disclose another user/platform scope when the caller has no active
  session.

steps:
  - id: S1
    name: "Add stop-scope isolation regressions"
    description: >
      Extend tests/test_hermes_tavern_session_browser.py with cross-user
      coverage for /rp end and /rp archive. Stopping or archiving the caller's
      active session must leave another active user scope unchanged, and a
      no-active caller response must not expose the other scope's session id or
      scope key.
    status: verified
    changed_file: "tests/test_hermes_tavern_session_browser.py"
    result: "PASS - focused session-browser regressions passed"

  - id: S2
    name: "Focused session isolation tests"
    description: >
      Run focused session browser and store/session tests covering /rp switch,
      /rp archive, /rp end, and scoped session lookup boundaries.
    verification_command: >
      python -m pytest tests/test_hermes_tavern_session_browser.py tests/test_hermes_tavern_sessions.py -q -o 'addopts='
    status: verified
    result: "PASS - controller rerun 2026-05-29; 63 passed in 1.52s"

  - id: S3
    name: "Full py_compile gate"
    description: >
      Compile the standalone plugin source, importers, compatibility shim, and
      Tavern test modules.
    verification_command: >
      python -m py_compile conftest.py plugins/__init__.py plugins/hermes_tavern/__init__.py src/hermes_tavern/*.py src/hermes_tavern/importers/*.py tests/test_hermes_tavern_*.py
    status: verified
    result: "PASS - controller rerun 2026-05-29; no compile errors"

  - id: S4
    name: "Full Tavern pytest gate"
    description: >
      Run the complete Hermes Tavern test glob after the stop-scope isolation
      regressions.
    verification_command: >
      python -m pytest tests/test_hermes_tavern_*.py -q -o 'addopts='
    status: verified
    result: "PASS - controller rerun 2026-05-29; 576 passed in 9.96s"

  - id: S5
    name: "Checklist YAML validation"
    description: >
      Validate this CodeStable checklist with the project YAML validator.
    verification_command: >
      python design/codestable/tools/validate-yaml.py --file design/codestable/features/2026-05-29-hermes-tavern-phase73-stop-scope-isolation/checklist.yaml
    status: verified
    result: "PASS - controller rerun 2026-05-29; 1 file passed, 0 failed"

implementation_notes: |
  - This phase is test-only; no source/runtime/provider code changed.
  - The codebase has /rp end and /rp archive as the stop-like active-session
    termination commands; no /rp stop command is currently registered.
  - The tests use local sqlite stores and do not introduce secrets, real
    provider calls, model calls, network calls, or production imports from
    plugins.hermes_tavern under src/hermes_tavern/.
