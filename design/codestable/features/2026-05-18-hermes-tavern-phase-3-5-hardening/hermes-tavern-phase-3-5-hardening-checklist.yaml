    status: completed

  - action: "Utilities: add plugins/hermes_tavern/utils.py exposing estimate_tokens(text: str) -> int using max(1, len(text) // 4)"
    exit_signal: "estimate_tokens('hello world') returns integer >= 1; estimate_tokens('') returns 1; no tiktoken import"
    status: completed

  - action: "Test coverage: add adapter enum-key test for _get_adapter; create tests/fixtures/cards/st_v2.json and tests/fixtures/cards/direct.json; add fixture-based parse tests"
    exit_signal: "all tests/plugins/test_hermes_tavern_*.py pass; tests/fixtures/cards/ contains both fixture files"
    status: completed

