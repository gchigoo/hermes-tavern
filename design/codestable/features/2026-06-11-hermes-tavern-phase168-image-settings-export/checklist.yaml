      - "Create phase168-acceptance.md acceptance report."
      - "Update ARCHITECTURE.md command-surface listing for /rp image settings export."
      - "Update HERMES_TAVERN_DESIGN.md for Phase 168 current behavior."
      - "Rerun focused Tavern tests and full pytest suite as controller verification."
      - "Run git reverse-scope and stale-wording guards."
      - "Run validators on YAML and frontmatter artifacts."
    verification:
      - command: "python -m pytest tests/test_hermes_tavern_images.py -q -o 'addopts=' -p no:cacheprovider"
        expected: "passes"
      - command: "python -m pytest tests/test_hermes_tavern_*.py -q -o 'addopts=' -p no:cacheprovider"
        expected: "passes"
      - command: "git diff --check"
        expected: "passes"
