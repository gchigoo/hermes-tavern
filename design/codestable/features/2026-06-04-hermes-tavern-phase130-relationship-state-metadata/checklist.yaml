checks:
  - id: C1
    name: "C1: Persistence contract"
    status: planned
    criteria: >
      Migration creates the relationship-state table and project index; CRUD/list
      helpers handle valid projects/IDs, missing projects/IDs, blank labels, and
      blank state text with bounded behavior.

  - id: C2
    name: "C2: Command contract"
    status: planned
    criteria: >
      `/rp relationship add <project-id> <label> <state...>`,
      `/rp relationship list [project-id]`,
      `/rp relationship inspect <relationship-id>`,
      `/rp relationship update <relationship-id> <state...>`, and
      `/rp relationship delete <relationship-id>` return compact normal and
      error messages and are visible in `/rp help`.

  - id: C3
    name: "C3: Markdown export"
    status: planned
    criteria: >
      Project Markdown export includes `## Relationships` only when relationship
      states exist, orders it after Style Guide and before Chapters, and omits it
      for projects without relationship states.

  - id: C4
    name: "C4: Offline no-leak boundary"
    status: planned
    criteria: >
      Relationship-state text does not appear in `/rp debug prompt` or
      `/rp debug context`; prompt module selection, provider calls, model routing,
      content mode, credentials, generation, vectorization/retrieval, and
      summarization behavior remain unchanged.

  - id: C5
    name: "C5: Reverse-scope verification"
    status: planned
    criteria: >
      No protected core files, build artifacts, provider/model/generation files,
      credential paths, cloud/collab paths, minors/underage paths, or
      provider-safety bypass behavior are changed.
