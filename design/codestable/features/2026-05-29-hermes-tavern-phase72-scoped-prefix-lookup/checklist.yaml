doc_type: feature-checklist
feature: hermes-tavern-phase72-scoped-prefix-lookup
date: "2026-05-29"
status: implemented

summary: >
  Add direct store regression coverage for scoped session id prefix lookup.
  list_sessions_by_id_prefix_for_scope(scope_key, prefix, include_all=True)
  must only return sessions inside the requested caller scope, including when
  another scope has a session matching the same short prefix or full id. The
  same-scope duplicate-prefix behavior remains intact so callers can detect
  ambiguity.

steps:
  - id: S1
    name: "Add scoped prefix lookup regressions"
    description: >
      Extend tests/test_hermes_tavern_sessions.py with direct TavernStore
      coverage for cross-scope short-prefix collisions, cross-scope full-id
      exclusion, and same-scope duplicate-prefix matches.
    status: verified
    changed_file: "tests/test_hermes_tavern_sessions.py"
    result: "PASS - focused DB/session tests passed"

  - id: S2
    name: "Focused DB/session tests"
    description: >
      Run the direct session store tests that include the new scoped prefix
      lookup regressions.
    verification_command: >
      python -m pytest tests/test_hermes_tavern_sessions.py tests/test_hermes_tavern_session_browser.py -q -o 'addopts='
    status: verified
    result: "PASS — controller rerun 2026-05-29; 59 passed in 1.43s"

  - id: S3
    name: "py_compile smoke check"
    description: >
      Compile the standalone shim, source modules, importer modules, and Tavern
      tests after the test-only phase.
    verification_command: >
      python -m py_compile conftest.py plugins/__init__.py plugins/hermes_tavern/__init__.py src/hermes_tavern/*.py src/hermes_tavern/importers/*.py tests/test_hermes_tavern_*.py
    status: verified
    result: "PASS — controller rerun 2026-05-29; no syntax errors"

  - id: S4
    name: "Full Tavern test suite"
    description: >
      Run the full standalone Tavern pytest glob and record any transient image
      failures honestly without changing unrelated runtime/provider code.
    verification_command: >
      python -m pytest tests/test_hermes_tavern_*.py -q -o 'addopts='
    status: verified
    result: >
      PASS — controller rerun 2026-05-29; 572 passed in 9.40s. Codex's own
      subprocess previously reported 8 transient image-test failures, but the
      controller-owned rerun is green.

  - id: S5
    name: "Checklist YAML validation"
    description: >
      Validate this CodeStable checklist with the project YAML validator.
    verification_command: >
      python design/codestable/tools/validate-yaml.py --file design/codestable/features/2026-05-29-hermes-tavern-phase72-scoped-prefix-lookup/checklist.yaml
    status: verified
    result: "PASS — controller rerun 2026-05-29; 1 file passed, 0 failed"

implementation_notes: |
  - This phase is test-only; no source/runtime/provider code changed.
  - The tests use local sqlite stores and deterministic id updates to avoid
    secrets, real provider calls, network calls, and nondeterministic UUID
    prefix collisions.
  - The full pytest glob still reports the transient image-test failure pattern
    observed in recent phases; this phase deliberately leaves image provider
    behavior untouched.
