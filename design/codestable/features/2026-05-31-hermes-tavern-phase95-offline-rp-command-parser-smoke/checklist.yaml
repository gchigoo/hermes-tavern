doc_type: feature-checklist
feature: hermes-tavern-phase95-offline-rp-command-parser-smoke
date: "2026-05-31"
status: implemented

summary: >
  Strengthen the offline-only /rp command parser and dispatcher smoke contract
  for Hermes Tavern mobile and Telegram roleplay UX. This phase must not start,
  reload, restart, kill, or manage Gateway, and must not call real Telegram,
  Gateway, provider/model, network, ComfyUI, TTS, or credential endpoints.

steps:
  - id: S1
    name: "Strengthen parser smoke coverage"
    description: >
      Extend tests/test_hermes_tavern_commands.py with pure offline parser
      cases for leading/trailing spaces, tabs, and newlines around /rp commands;
      mixed-case command names normalized to lowercase; /rp with no subcommand
      mapping to help; split args preservation; stripped raw text preservation;
      non-/rp near-misses; and unknown commands parsing structurally before
      dispatch.
    status: implemented
    changed_file: "tests/test_hermes_tavern_commands.py"
    result: "IMPLEMENTED - added focused parser edge cases without runtime calls"

  - id: S2
    name: "Lock help and dispatch table contracts"
    description: >
      Add offline command tests proving /rp help output is generated exactly from
      TAVERN_COMMAND_TABLE help_lines and preserving representative dispatcher
      metadata coverage for default command+event, event-only, command-only, and
      no-arg handlers.
    status: implemented
    changed_file: "tests/test_hermes_tavern_commands.py"
    result: "IMPLEMENTED - added full table-derived help assertion and retained direct fake-runtime dispatch checks"

  - id: S3
    name: "Record Phase95 checklist"
    description: >
      Add this CodeStable checklist for the offline command parser smoke slice,
      keeping implementation and verification gates explicit and scoped.
    status: implemented
    changed_file: "design/codestable/features/2026-05-31-hermes-tavern-phase95-offline-rp-command-parser-smoke/checklist.yaml"
    result: "IMPLEMENTED - checklist created with focused command, compile, pytest, YAML, and diff gates"

  - id: S4
    name: "Focused commands pytest"
    description: >
      Run only the Hermes Tavern command parser and dispatcher smoke module.
    verification_command: >
      python -m pytest tests/test_hermes_tavern_commands.py -q -o 'addopts='
    status: verified
    result: "PASS - controller rerun returned 26 passed in 0.02s"

  - id: S5
    name: "Full py_compile gate"
    description: >
      Compile the compatibility shim, standalone plugin source, importers, and
      Tavern test modules.
    verification_command: >
      python -m py_compile conftest.py plugins/__init__.py plugins/hermes_tavern/__init__.py src/hermes_tavern/*.py src/hermes_tavern/importers/*.py tests/test_hermes_tavern_*.py
    status: verified
    result: "PASS - controller rerun exited 0 with no compile output"

  - id: S6
    name: "Full Tavern pytest gate"
