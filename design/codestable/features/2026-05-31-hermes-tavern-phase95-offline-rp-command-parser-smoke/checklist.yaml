      Run the complete Hermes Tavern test glob after the command parser smoke
      additions, without managing Gateway or calling real providers.
    verification_command: >
      python -m pytest tests/test_hermes_tavern_*.py -q -o 'addopts='
    status: verified
    result: "PASS - controller rerun returned 642 passed in 19.42s"

  - id: S7
    name: "Checklist YAML validation"
    description: >
      Validate this CodeStable checklist with the project YAML validator.
    verification_command: >
      python design/codestable/tools/validate-yaml.py --file design/codestable/features/2026-05-31-hermes-tavern-phase95-offline-rp-command-parser-smoke/checklist.yaml
    status: verified
    result: "PASS - controller rerun validated 1 file: 1 passed, 0 failed"

  - id: S8
    name: "Scoped diff whitespace check"
    description: >
      Check only the files touched by this phase for whitespace errors.
    verification_command: >
      git diff --check -- tests/test_hermes_tavern_commands.py design/codestable/features/2026-05-31-hermes-tavern-phase95-offline-rp-command-parser-smoke/checklist.yaml
    status: verified
    result: "PASS - controller rerun exited 0 with no whitespace errors"

implementation_notes: |
  - This phase is test and checklist only; no command runtime behavior changed.
  - The parser smoke cases call parse_rp_command directly and remain pure,
    offline, and in-process.
  - The unknown-command tests assert parsing succeeds first and dispatch is the
    boundary that turns an unrecognized command into a mobile-safe unknown
    response.
  - Help output is checked against TAVERN_COMMAND_TABLE so future table changes
    cannot drift behind stale hardcoded help assertions.
  - Existing dirty worktree changes outside the command test and this checklist
    are not modified by this phase.

