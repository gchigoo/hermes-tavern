  - id: S5
    name: "Checklist YAML validation"
    description: >
      Validate this checklist with the project YAML validator.
    verification_command: >
      python design/codestable/tools/validate-yaml.py --file design/codestable/features/2026-05-29-hermes-tavern-phase64-missing-adapter-skip/checklist.yaml
