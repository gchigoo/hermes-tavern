doc_type: feature-checklist
feature: hermes-tavern-phase64-missing-adapter-skip
date: "2026-05-29"
status: implemented

summary: >
  Add a low-risk, test-only gateway hook regression proving that /rp command
  interception still returns skip when the gateway has no matching adapter.
  This preserves runtime behavior while guarding mobile gateway safety around
  missing delivery adapters.

steps:
  - id: S1
    name: "Add missing-adapter /rp skip regression"
    description: >
      Extend tests/test_hermes_tavern_gateway_hook.py with a fake gateway whose
      adapters mapping cannot resolve the event platform. The test asserts /rp
      help is still handled by pre_gateway_dispatch and returns the Tavern skip
      contract without requiring a send path.
    status: verified
    changed_file: "tests/test_hermes_tavern_gateway_hook.py"
    result: "PASS - focused gateway hook test passed"

  - id: S2
    name: "Focused gateway tests"
    description: >
      Run the gateway hook and gateway dispatch test modules to verify the new
      regression and existing Telegram/mobile gateway contracts.
    verification_command: >
      python -m pytest tests/test_hermes_tavern_gateway_hook.py tests/test_hermes_tavern_gateway.py -q -o 'addopts='
    status: verified
    result: "PASS — controller rerun 2026-05-29; 16 passed in 0.37s"

  - id: S3
    name: "py_compile smoke check"
    description: >
      Compile the standalone shim, source modules, importer modules, and Tavern
      tests without changing runtime behavior.
    verification_command: >
      python -m py_compile conftest.py plugins/__init__.py plugins/hermes_tavern/__init__.py src/hermes_tavern/*.py src/hermes_tavern/importers/*.py tests/test_hermes_tavern_*.py
    status: verified
    result: "PASS — controller rerun 2026-05-29; no syntax errors"

  - id: S4
    name: "Full Tavern test suite"
    description: >
      Run the full standalone Tavern pytest glob and record any transient image
      failures without changing unrelated runtime code.
    verification_command: >
