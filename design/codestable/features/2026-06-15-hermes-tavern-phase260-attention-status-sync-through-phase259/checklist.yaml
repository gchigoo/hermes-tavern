    command: "python -c 'from pathlib import Path; allowed = {Path(p) for p in [\"design/codestable/attention.md\", \"tests/test_hermes_tavern_codestable_status.py\", \"design/codestable/features/2026-06-15-hermes-tavern-phase260-attention-status-sync-through-phase259/design.md\", \"design/codestable/features/2026-06-15-hermes-tavern-phase260-attention-status-sync-through-phase259/checklist.yaml\", \"design/codestable/features/2026-06-15-hermes-tavern-phase260-attention-status-sync-through-phase259/phase260-acceptance.md\"]}; changed = {Path(p) for p in [\"design/codestable/attention.md\", \"tests/test_hermes_tavern_codestable_status.py\", \"design/codestable/features/2026-06-15-hermes-tavern-phase260-attention-status-sync-through-phase259/design.md\", \"design/codestable/features/2026-06-15-hermes-tavern-phase260-attention-status-sync-through-phase259/checklist.yaml\"]}; extra = changed - allowed; assert not extra, f\"Unexpected changed paths: {extra}\"; print(\"PASS\")'"

