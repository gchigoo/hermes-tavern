doc_type: feature-checklist
feature: hermes-tavern-phase53-dist-info-metadata-sync
date: "2026-05-29"
status: implemented

summary: >
  Phases 49/50/51 added classifiers, keywords, authors, license, and readme to
  pyproject.toml but the editable install was never refreshed, leaving the
  dist-info METADATA file at 4 bare lines (Name, Version, Summary,
  Requires-Python only). This phase re-runs the editable install to regenerate
  METADATA, then adds test_package_metadata_is_complete to the packaging test
  module so a stale dist-info is caught before future pyproject.toml changes
  are published with incomplete metadata.

steps:
  - id: S1
    name: "Re-run editable install to regenerate dist-info METADATA"
    description: >
      Run ``pip install -e .`` from the project root.  setuptools regenerates
      hermes_tavern-0.1.0.dist-info/METADATA from the current pyproject.toml,
      adding Author, License, Keywords, 7 Classifier entries, and the embedded
      README (Description-Content-Type: text/markdown).
    status: verified
    changed_file: "hermes_tavern-0.1.0.dist-info/METADATA (in site-packages)"
    result: "PASS — 2026-05-29; METADATA now has Author, License, Keywords, 7 Classifiers, Description-Content-Type"

  - id: S2
    name: "Add test_package_metadata_is_complete"
    description: >
      Add test_package_metadata_is_complete to tests/test_hermes_tavern_packaging.py.
      The test reads importlib.metadata for hermes-tavern and asserts that Author,
      License, Keywords, Description-Content-Type are non-empty, and that at least
      one Python and one OSI license classifier is present.  Fails if dist-info
      is stale or if a future pyproject.toml change drops required metadata fields.
    status: verified
    changed_file: "tests/test_hermes_tavern_packaging.py"
    result: "PASS — 2026-05-29; test_package_metadata_is_complete passes; all assertions satisfied"

  - id: S3
    name: "py_compile smoke check"
    description: >
      Compile all shim, source, importer, and test files to confirm no syntax errors.
    status: verified
    verification_command: >
      python -m py_compile conftest.py plugins/__init__.py plugins/hermes_tavern/__init__.py src/hermes_tavern/*.py src/hermes_tavern/importers/*.py tests/test_hermes_tavern_*.py
    result: "PASS — 2026-05-29; no syntax errors"

  - id: S4
    name: "Full standalone test suite"
    description: >
      Run the full standalone Tavern pytest glob to verify no regressions.
      Expect 451 passed (was 450; +1 new metadata completeness test).
    status: verified
    verification_command: >
      python -m pytest tests/test_hermes_tavern_*.py -q -o 'addopts='
    result: "PASS — 2026-05-29; 451 passed in 9.74s (was 450; +1 new test)"

  - id: S5
    name: "Checklist YAML validation"
    description: >
      Validate this CodeStable checklist with the project YAML validator.
    status: verified
    verification_command: >
      python design/codestable/tools/validate-yaml.py --file design/codestable/features/2026-05-29-hermes-tavern-phase53-dist-info-metadata-sync/checklist.yaml
    result: "PASS — 2026-05-29; 1 file passed, 0 failed"

implementation_notes: |
  - The METADATA file in site-packages is written at ``pip install`` time from
    pyproject.toml.  An editable install does NOT auto-update METADATA when
    pyproject.toml changes — only a fresh ``pip install -e .`` does.  This is
    a setuptools-editable-install design property, not a bug.
  - Before this phase, the stale METADATA had passed all existing tests because
    test_version_attribute_matches_package_metadata only checks the version
    string (which is separately embedded in the .dist-info/RECORD and re-read
    dynamically), not the full metadata record.
  - test_package_metadata_is_complete checks five distinct metadata signals so
    a partial pyproject.toml revert (e.g. removing classifiers) is caught
    before publishing.
  - No source files or conftest were modified; only a new test was added.
